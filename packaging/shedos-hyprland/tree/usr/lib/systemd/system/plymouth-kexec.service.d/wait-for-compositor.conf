# Hold plymouthd in --mode=reboot for 1s so Hyprland (running under uwsm
# at the user level — decoupled from greetd's system-level service stop)
# can release DRM master before plymouthd tries to acquire it. Without
# this, plymouthd loses the DRM race and the shedos shutdown brand never
# renders before plymouth-switch-root-initramfs pivots to the shutdown
# initramfs (whose fd-escrow holds whatever was last on the framebuffer).
[Service]
ExecStartPre=/bin/sleep 1
