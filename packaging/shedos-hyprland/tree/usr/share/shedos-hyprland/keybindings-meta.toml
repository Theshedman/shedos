# Display metadata for `shedman keybindings`. Source of truth for the
# *display* (program name + description); the binding itself comes from
# /etc/skel/.config/hypr/keybindings.conf. Custom user binds without a
# metadata entry surface under "Other" with the raw exec line.
#
# `keys` format: modifiers in canonical order (SUPER, CTRL, SHIFT, ALT)
# joined with `+`, then the key. Examples: SUPER+Return, SUPER+SHIFT+U.
# For non-modifier-prefixed binds (Print, XF86…), `keys` is just the
# key. Match is case-sensitive.

# ---- Applications ----------------------------------------------------

[[bind]]
keys = "SUPER+Return"
category = "Applications"
name = "Terminal"
description = "Open a new terminal window"

[[bind]]
keys = "SUPER+SHIFT+Return"
category = "Applications"
name = "Floating Terminal"
description = "Open a terminal that floats above tiled windows"

[[bind]]
keys = "SUPER+D"
category = "Applications"
name = "Application Launcher"
description = "Search and launch installed applications"

[[bind]]
keys = "SUPER+E"
category = "Applications"
name = "Code Editor"
description = "Open Visual Studio Code"

[[bind]]
keys = "SUPER+N"
category = "Applications"
name = "File Manager"
description = "Open a new file manager window"

[[bind]]
keys = "SUPER+A"
