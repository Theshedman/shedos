# wayland-wm@.service is uwsm's compositor template (instances:
# wayland-wm@hyprland.desktop.service for Hyprland). It inherits
# stderr from its caller, which on shedos resolves to /dev/console
# = /dev/tty1. Hyprland's wlroots-based renderer prints debug output
# (system info, NVIDIA detection warning, GLES2 backend init) to
# stderr; without this drop-in, those writes reach tty1's vcs
# buffer and are painted by fbcon during DRM-master gaps.
#
# Companion to /etc/systemd/system/user@.service.d/journal-only.conf
# shipped via shedos-system; this one is hyprland-specific because
# uwsm's template lives outside shedos-system's scope.
[Service]
StandardOutput=journal
StandardError=journal
