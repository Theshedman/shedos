# ShedOS Hyprland touchpad gestures. Hyprland 0.51 reworked gestures
# into the `gesture = …` directive; the old `gestures { workspace_swipe }`
# block no longer exists. Syntax:
#
#   gesture = <fingers>, <direction>, [mod: MASK,] [scale: FLOAT,] <action> [, args]
#
# Two-finger swipes stay reserved for libinput (scroll / right-click);
# two-finger pinch is not bindable in plain-text config (no cursorzoom
# action in the .conf parser — only the Lua API has it).

# 3-finger horizontal — switch workspaces. Carries any window
# currently being dragged with Super+LMB, so the "drag a window
# across workspaces" flow works for free.
gesture = 3, horizontal, workspace

# 3-finger pinch — toggle fullscreen / float on the active window.
gesture = 3, pinchin,  fullscreen
gesture = 3, pinchout, float

# 4-finger horizontal — move the active window to the prev/next
# workspace. No modifier needed.
gesture = 4, left,  dispatcher, movetoworkspace, e-1
gesture = 4, right, dispatcher, movetoworkspace, e+1

# 4-finger pinch out — show desktop (toggles the `minimized` special
# workspace; pinch out again restores).
gesture = 4, pinchout, dispatcher, togglespecialworkspace, minimized

# ---- Hyprspace plugin: workspace overview --------------------------
# The plugin = line must come before any bind/gesture that references
# the overview:* dispatchers. Hyprspace renders a macOS-Mission-Control
# strip at the bottom of the screen with live window thumbnails;
# autoDrag = 1 lets users drag windows between workspaces inside the
# overview. switchOnDrop = 1 also switches the active workspace to
# the drop target.
plugin = /usr/lib/hyprland/Hyprspace.so

plugin {
    overview {
        centerAligned = 1            # macOS-style horizontal alignment
        onBottom = 0                 # panel at the top of the screen (Mission Control)
        panelHeight = 250
        workspaceMargin = 12
        workspaceBorderSize = 1
        affectStrut = 1              # reserve top 250px so tiled windows reflow below the panel
        autoDrag = 1                 # drag-window-between-workspaces
        switchOnDrop = 1             # follow the window to its new workspace
        exitOnClick = 1              # click outside to close overview
        exitOnSwitch = 1             # close overview when workspace switches
    }
}

# 3-finger and 4-finger up/down are paired opposites: up opens the
# overview, down closes it. Using overview:open / overview:close
# (instead of toggle) makes the gesture direction match the result
# regardless of current state.
gesture = 3, up,   dispatcher, overview:open
gesture = 3, down, dispatcher, overview:close
gesture = 4, up,   dispatcher, overview:open
gesture = 4, down, dispatcher, overview:close

# 4-finger pinch in opens the launcher.
gesture = 4, pinchin, dispatcher, exec, shedman launcher

# Keyboard parity: Super+Tab toggles the overview.
bind = $mainMod, Tab, overview:toggle
