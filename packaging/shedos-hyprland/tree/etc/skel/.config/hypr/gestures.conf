# ShedOS Hyprland touchpad gestures. macOS-style 2/3/4-finger swipes
# and pinches. Hyprland 0.51 reworked gestures into the `gesture = …`
# directive; the old `gestures { workspace_swipe }` block no longer
# exists. Syntax:
#
#   gesture = <fingers>, <direction>, [mod: MASK,] [scale: FLOAT,] <action> [, args]

# 2-finger pinch — cursor zoom (accessibility magnifier). 2-finger
# horizontal/vertical swipes stay reserved for libinput scroll and
# right-click; only pinch is bindable here without fighting libinput.
gesture = 2, pinchin,  cursorzoom, 2.0, mult
gesture = 2, pinchout, cursorzoom, 0.5, mult

# 3-finger horizontal — switch workspaces. Carries any window
# currently being dragged with Super+LMB, so the "drag a window
# across workspaces" macOS flow works for free.
gesture = 3, horizontal, workspace

# 3-finger pinch — toggle fullscreen / float on the active window.
gesture = 3, pinchin,  fullscreen
gesture = 3, pinchout, float

# 4-finger horizontal — move the active window to the prev/next
# workspace. No modifier needed.
gesture = 4, left,  dispatcher, movetoworkspace, e-1
gesture = 4, right, dispatcher, movetoworkspace, e+1

# 4-finger down — toggle the scratchpad / special workspace.
gesture = 4, down, special

# 4-finger pinch out — show desktop (toggles the `minimized` special
# workspace; pinch out again restores).
gesture = 4, pinchout, dispatcher, togglespecialworkspace, minimized

# Workspace overview. Plugin shipped by shedos-hyprland-plugin-hyprexpo
# (built in-tree against the matching Hyprland release).
plugin = /usr/lib/hyprland/hyprexpo.so

plugin {
    hyprexpo {
        columns = 3
        gap_size = 8
        bg_col = rgb(1e1e2e)
        workspace_method = center current
        skip_empty = false
        gesture_distance = 300
    }
}

# 3-finger and 4-finger swipe up both open the overview.
gesture = 3, up, dispatcher, hyprexpo:expo, toggle
gesture = 4, up, dispatcher, hyprexpo:expo, toggle

# 3-finger swipe down lists every open window via walker.
gesture = 3, down, dispatcher, exec, walker --provider windows

# 4-finger pinch in opens the launcher.
gesture = 4, pinchin, dispatcher, exec, shedman launcher
