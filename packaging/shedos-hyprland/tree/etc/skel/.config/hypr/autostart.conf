# ShedOS Hyprland autostart applications.

# uwsm finalize signals compositor readiness for the Type=notify
# wayland-session unit; without it, greetd login loops.
exec-once = uwsm finalize

# Apply GTK/icon/cursor theme via gsettings so apps that query
# org.gnome.desktop.interface (nautilus, GNOME Calendar, etc.) also pick
# up the active theme. The script is regenerated by `shedman theme
# apply` from /etc/shedos/system.toml [theme], so a palette change
# propagates here on the next login or shedman apply.
exec-once = bash /etc/shedos/themes/current/gsettings.sh

# elephant feeds walker; required before any walker --provider call.
# Both run as long-lived daemons so Super+D / Super+C are instant
# (dbus toggles into the warm walker service rather than cold starts).
exec-once = elephant
exec-once = walker --gapplication-service
exec-once = /usr/lib/shedos/hyprland-position-fixer
exec-once = jetbrains-toolbox --minimize
exec-once = /usr/bin/shedos-user-session
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Long-running daemons (waybar, mako, hypridle, awww-daemon) are now
# systemd user units with Restart=on-failure, so they survive
# individual crashes and respawn after a Hyprland restart without
# relying on exec-once. See:
#   /usr/lib/systemd/user/{waybar,mako,hypridle}.service  (upstream)
#   /usr/lib/systemd/user/shedos-wallpaper.service         (ShedOS)
