# ShedOS Hyprland autostart applications.

# Apply GTK/icon/cursor theme via gsettings so apps that query
# org.gnome.desktop.interface (nautilus, GNOME Calendar, etc.) also pick
# up Catppuccin + Papirus icons. GTK3/4 apps read the same from
# ~/.config/gtk-{3,4}.0/settings.ini; this covers the rest.
exec-once = sh -c 'gsettings set org.gnome.desktop.interface icon-theme "Papirus-Dark"; gsettings set org.gnome.desktop.interface gtk-theme "Catppuccin-Mocha-Standard-Blue-Dark"; gsettings set org.gnome.desktop.interface cursor-theme "Adwaita"; gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"; gsettings set org.gnome.desktop.interface font-name "Inter 11"'

# elephant feeds walker; required before any walker --provider call.
exec-once = elephant &
exec-once = waybar
exec-once = gnome-keyring-daemon --start --components=secrets,pkcs11,ssh
exec-once = mako
exec-once = /usr/bin/shedos-user-session
exec-once = /usr/bin/shedman welcome
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = awww-daemon
exec-once = sleep 1 && awww img ~/.config/hypr/wallpapers/shedos_wallpaper_logo_4k.png
exec-once = hypridle
exec-once = hyprlock
