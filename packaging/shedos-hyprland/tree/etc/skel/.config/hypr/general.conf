# ShedOS Hyprland general behavior, layouts, and misc settings.

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2

    # Catppuccin Mocha colors
    col.active_border = rgba(89b4faee) rgba(cba6f7ee) 45deg
    col.inactive_border = rgba(585b70aa)

    layout = dwindle
    allow_tearing = false
}

dwindle {
    pseudotile = true
    preserve_split = true
    force_split = 2
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    vfr = true
    # disable_watchdog_warning suppresses the cosmetic "started without
    # start-hyprland" warning. greetd execs Hyprland directly, bypassing
    # the wrapper; only crash-recovery watchdog is impacted.
    disable_watchdog_warning = true
    # Lets a new lock client take over after one crashes — without this, the seat is bricked until reboot.
    allow_session_lock_restore = true
}
