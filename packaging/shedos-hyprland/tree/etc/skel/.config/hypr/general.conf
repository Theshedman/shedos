# ShedOS Hyprland general behavior, layouts, and misc settings.

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2

    # Catppuccin Mocha colors
    col.active_border = rgba(89b4faee) rgba(cba6f7ee) 45deg
    col.inactive_border = rgba(585b70aa)

    layout = dwindle
    allow_tearing = false
}

dwindle {
    pseudotile = true
    preserve_split = true
    force_split = 2
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    vfr = true
    # Suppress: "Hyprland was started without start-hyprland. This is highly
    # not recommended." — SDDM's wayland-session wrapper re-execs via the
    # user's login shell, which can drop the --watchdog-fd Hyprland expects,
    # so the launch path LOOKS bare even when start-hyprland is in the chain.
    # The warning is cosmetic; crash-recovery watchdog is the only feature lost.
    disable_watchdog_warning = true
}
