# ShedOS Hyprland input (keyboard, mouse, touchpad).

input {
    kb_layout = us
    # Caps Lock behaves as Caps Lock (explicit default). Alternative remaps:
    #   kb_options = caps:escape        # Caps Lock → Escape (one-way, vim-friendly)
    #   kb_options = caps:swapescape    # Caps Lock ↔ Escape swap
    #   kb_options = caps:ctrl_modifier # Caps Lock → Ctrl (ergonomic swap)
    #   kb_options = caps:none          # Caps Lock disabled entirely
    kb_options = caps:capslock

    follow_mouse = 1

    touchpad {
        natural_scroll = true
        tap-to-click = true
        drag_lock = true
    }

    sensitivity = 0
    accel_profile = flat
}
