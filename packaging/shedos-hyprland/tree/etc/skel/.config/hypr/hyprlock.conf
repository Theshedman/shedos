# shedOS Hyprlock Configuration
# Theme: Catppuccin Mocha

# ─────────────────────────────────────────────────────────────
# General Settings
# ─────────────────────────────────────────────────────────────

general {
    hide_cursor = true
    ignore_empty_input = true
    fail_timeout = 2000
    # See through to the screensaver running underneath. The shedman
    # lock wrapper guarantees the screensaver is always up before
    # hyprlock starts, so transparency never leaks the desktop.
    transparent = true
}

# ─────────────────────────────────────────────────────────────
# Fingerprint Authentication
# ─────────────────────────────────────────────────────────────
auth {
    fingerprint {
        enabled = true
        ready_message = Scan fingerprint to unlock
        present_message = Scanning...
        retry_delay = 250 # in milliseconds
    }
}

# ─────────────────────────────────────────────────────────────
# Background
# ─────────────────────────────────────────────────────────────

background {
    monitor =
    path = /etc/shedos/themes/current/wallpaper.png
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# ─────────────────────────────────────────────────────────────
# Input Field
# ─────────────────────────────────────────────────────────────

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2

    # Catppuccin Mocha colors
    dots_size = 0.25
    dots_spacing = 0.35
    dots_center = true
    dots_rounding = -1

    outer_color = rgba(89b4faee)  # Blue
    inner_color = rgba(30, 30, 46, 0.9)  # Base
    font_color = rgba(205, 214, 244, 1.0)  # Text

    fade_on_empty = false
    fade_timeout = 1000

    placeholder_text = <span foreground="##cdd6f4">Enter Password</span>
    hide_input = false

    rounding = 10
    check_color = rgba(249, 226, 175, 1.0)  # Yellow
    fail_color = rgba(243, 139, 168, 1.0)  # Red
    fail_text = <span foreground="##f38ba8">Authentication Failed</span>

    capslock_color = rgba(245, 194, 231, 1.0)  # Pink
    numlock_color = -1
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = false

    position = 0, -120
    halign = center
    valign = center
}

# ─────────────────────────────────────────────────────────────
# Labels
# ─────────────────────────────────────────────────────────────

# Time
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%I:%M %p")"
    color = rgba(205, 214, 244, 1.0)  # Text
    font_size = 120
    font_family = JetBrainsMono Nerd Font

    position = 0, 300
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = rgba(205, 214, 244, 0.8)  # Text with transparency
    font_size = 24
    font_family = JetBrainsMono Nerd Font

    position = 0, 200
    halign = center
    valign = center
}

# User
label {
    monitor =
    text = Hi, $USER
    color = rgba(137, 180, 250, 1.0)  # Blue
    font_size = 32
    font_family = JetBrainsMono Nerd Font

    position = 0, -200
    halign = center
    valign = center
}

# shedOS branding
label {
    monitor =
    text = ShedOS
    color = rgba(137, 180, 250, 0.6)  # Blue with transparency
    font_size = 18
    font_family = JetBrainsMono Nerd Font Bold

    position = 0, 50
    halign = center
    valign = bottom
}

# Caps Lock indicator
label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/check-capslock.sh
    color = rgba(245, 194, 231, 1.0)  # Pink
    font_size = 14
    font_family = JetBrainsMono Nerd Font

    position = 0, -80
    halign = center
    valign = center
}
