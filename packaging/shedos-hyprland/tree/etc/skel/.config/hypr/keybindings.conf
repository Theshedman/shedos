# ShedOS Hyprland key bindings.

$mainMod = SUPER

# Applications
bind = $mainMod, Return, exec, kitty
bind = $mainMod, D, exec, shedman launcher
bind = $mainMod, E, exec, code
bind = $mainMod, N, exec, nautilus -w
bind = $mainMod, A, exec, postman
bind = $mainMod, B, exec, shedman browser
bind = $mainMod SHIFT, Return, exec, kitty --class=floating-terminal
bind = $mainMod ALT, J, exec, kitty --class=shedos-logs -e shedman logs
bind = $mainMod ALT, K, exec, shedman keybindings
bind = $mainMod SHIFT, U, exec, kitty --class=shedos-upgrade-history -e shedman update --history

# Window Management
bind = $mainMod, Q, killactive,
bind = $mainMod, V, togglefloating,
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, M, fullscreen, 1
bind = $mainMod, P, pseudo,
bind = $mainMod, J, togglesplit,

# Focus
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod SHIFT, J, movefocus, d

# Move windows
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u

# Resize windows
bind = $mainMod CTRL, left, resizeactive, -50 0
bind = $mainMod CTRL, right, resizeactive, 50 0
bind = $mainMod CTRL, up, resizeactive, 0 -50
bind = $mainMod CTRL, down, resizeactive, 0 50
bind = $mainMod CTRL, H, resizeactive, -50 0
bind = $mainMod CTRL, L, resizeactive, 50 0
bind = $mainMod CTRL, K, resizeactive, 0 -50
bind = $mainMod CTRL, J, resizeactive, 0 50

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Mouse bindings
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Screenshots
bind = , Print, exec, grim -g "$(slurp)" - | swappy -f -
bind = SHIFT, Print, exec, grim - | swappy -f -
bind = $mainMod, Print, exec, grim -g "$(slurp)" ~/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png

# Screen Recording; shedman screenrecord toggles via walker prompt;
# Super+Shift+R stops the active recording (idempotent if none).
bind = $mainMod, R, exec, /usr/bin/shedman screenrecord
bind = $mainMod SHIFT, R, exec, /usr/bin/shedman screenrecord --stop

# Color Picker
bind = $mainMod SHIFT, P, exec, hyprpicker -a

# Clipboard history. The two `wl-paste --watch cliphist store` exec-once
# entries in autostart.conf feed cliphist's store; walker's elephant-clipboard
# provider renders the picker. Pressing Return on an item copies it back to
# the clipboard; paste with the usual Ctrl+V.
bind = $mainMod, C, exec, walker --provider clipboard

# Lock screen
bind = $mainMod, Escape, exec, /usr/libexec/shedman/lock

# System controls
bind = $mainMod SHIFT, E, exec, command -v uwsm >/dev/null 2>&1 && uwsm stop || (command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit)
# Hyprland config reload; bound on Ctrl+Shift+R to leave Super+Shift+R for
# `shedman screenrecord --stop` (a chord users hit far more often).
bind = $mainMod SHIFT CTRL, R, exec, hyprctl reload

# Night Light
bind = $mainMod, F9, exec, /usr/bin/toggle-hyprsunset.sh

# Audio controls
# bindel = bind + e (repeat on hold) + l (fires even when session locked).
# Holding the + key ramps volume smoothly; mute/mic-mute still work
# while the lock screen is up.
bindel = , XF86AudioRaiseVolume, exec, pamixer -i 5
bindel = , XF86AudioLowerVolume, exec, pamixer -d 5
bindel = , XF86AudioMute,        exec, pamixer -t
bindel = , XF86AudioMicMute,     exec, pamixer --default-source -t

# Brightness controls (same repeat-on-hold + locked behavior)
bindel = , XF86MonBrightnessUp,   exec, brightnessctl set +5%
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Media controls
# bindl = bind + l (fires when locked); so skip/pause works from
# the lock screen. No repeat needed; these are one-shot toggles.
bindl = , XF86AudioPlay,  exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioNext,  exec, playerctl next
bindl = , XF86AudioPrev,  exec, playerctl previous
