# ShedOS Hypridle Configuration
# Idle management daemon for Hyprland

general {
    lock_cmd = systemctl --user start shedos-screensaver-lock.service
    before_sleep_cmd = loginctl lock-session    # lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on  # turn on display after resume
    ignore_dbus_inhibit = false
    # 3 = "lock notify": delay suspend until lock renders.
    inhibit_sleep = 3
}

# ─────────────────────────────────────────────────────────────
# Idle Listeners
# ─────────────────────────────────────────────────────────────

# Dim every monitor after 2.5 minutes. hyprshade applies the
# dim.frag shader to every Hyprland output; brightnessctl only
# touched the internal backlight, leaving external monitors lit.
listener {
    timeout = 150
    on-timeout = hyprshade on dim
    on-resume = hyprshade off
}

# Turn off keyboard backlight after 2.5 minutes
listener {
    timeout = 150
    on-timeout = brightnessctl -sd platform::kbd_backlight set 0
    on-resume = brightnessctl -rd platform::kbd_backlight
}

# Lock screen after 5 minutes idle. The lock client owns the
# four-phase cycle (screensaver → prompt → … → DPMS off) internally.
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}
