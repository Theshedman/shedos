# ShedOS Hypridle Configuration
# Idle management daemon for Hyprland

general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances
    before_sleep_cmd = loginctl lock-session    # lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on  # turn on display after resume
    ignore_dbus_inhibit = false
}

# ─────────────────────────────────────────────────────────────
# Idle Listeners
# ─────────────────────────────────────────────────────────────

# Dim screen after 2.5 minutes
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# Turn off keyboard backlight after 2.5 minutes
listener {
    timeout = 150
    on-timeout = brightnessctl -sd platform::kbd_backlight set 0
    on-resume = brightnessctl -rd platform::kbd_backlight
}

# Animated screensaver — fires 60 s before lock so the pre-lock idle
# window isn't just a dim+empty screen. The screensaver runs as a
# user-level systemd unit (KillSignal=SIGUSR1, TimeoutStopSec=5), so
# `systemctl --user stop` always tears it down — SIGUSR1 first, then
# SIGKILL after 5 s if needed. No string matching, no pattern drift.
listener {
    timeout = 240
    on-timeout = systemctl --user start shedos-screensaver.service
    on-resume = systemctl --user stop shedos-screensaver.service
}

# Lock screen after 5 minutes
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Turn off display after 6 minutes
listener {
    timeout = 360
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Suspend system after 10 minutes
listener {
    timeout = 600
    on-timeout = systemctl suspend
}
