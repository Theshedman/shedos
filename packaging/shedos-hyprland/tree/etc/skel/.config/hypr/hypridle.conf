# ShedOS Hypridle Configuration
# Idle management daemon for Hyprland

general {
    lock_cmd = /usr/libexec/shedman/lock        # screensaver + hyprlock wrapper
    before_sleep_cmd = loginctl lock-session    # lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on  # turn on display after resume
    ignore_dbus_inhibit = false
    # 3 = "lock notify": delay suspend until lock renders.
    inhibit_sleep = 3
}

# ─────────────────────────────────────────────────────────────
# Idle Listeners
# ─────────────────────────────────────────────────────────────

# Dim screen after 2.5 minutes
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# Turn off keyboard backlight after 2.5 minutes
listener {
    timeout = 150
    on-timeout = brightnessctl -sd platform::kbd_backlight set 0
    on-resume = brightnessctl -rd platform::kbd_backlight
}

# Screensaver runs for 5 minutes before hyprlock takes over.
listener {
    timeout = 300
    on-timeout = pidof hyprlock || systemctl --user start shedos-screensaver.service
    on-resume = pidof hyprlock || systemctl --user stop shedos-screensaver.service
}

# Lock screen after 10 minutes idle.
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# Turn off display 2 minutes after lock.
listener {
    timeout = 720
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
