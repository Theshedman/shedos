# shedOS Hypridle Configuration
# Idle management daemon for Hyprland

general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances
    before_sleep_cmd = loginctl lock-session    # lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on  # turn on display after resume
    ignore_dbus_inhibit = false
}

# ─────────────────────────────────────────────────────────────
# Idle Listeners
# ─────────────────────────────────────────────────────────────

# Dim screen after 2.5 minutes
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# Turn off keyboard backlight after 2.5 minutes
listener {
    timeout = 150
    on-timeout = brightnessctl -sd platform::kbd_backlight set 0
    on-resume = brightnessctl -rd platform::kbd_backlight
}

# Animated screensaver — fires 60 s before lock so the pre-lock idle
# window isn't just a dim+empty screen. SIGUSR1 on-resume tears it
# down before the user's first keypress reaches anything else, so
# the lockscreen handoff is uninterrupted.
listener {
    timeout = 240
    on-timeout = systemd-run --user --scope --quiet --unit=shedos-screensaver /usr/bin/shedos-screensaver --mode=wayland --idle-daemon --shuffle 60
    on-resume = pkill -SIGUSR1 -f 'shedos-screensaver --idle-daemon' || true
}

# Lock screen after 5 minutes
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Turn off display after 6 minutes
listener {
    timeout = 360
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Suspend system after 10 minutes
listener {
    timeout = 600
    on-timeout = systemctl suspend
}
