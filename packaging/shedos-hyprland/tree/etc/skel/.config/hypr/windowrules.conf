# ShedOS Hyprland window rules.
#
# Hyprland 0.46+ replaced the comma-form `windowrule = ...` with block syntax.
# Each block has a unique `name`, one or more `match:<prop>` matchers, and
# action fields like float/center/size/opacity/pin.

# Simple floaters (no size/center)
windowrule {
    name = float-pavucontrol
    match:class = ^(pavucontrol)$
    float = true
}
windowrule {
    name = float-nm-connection-editor
    match:class = ^(nm-connection-editor)$
    float = true
}
windowrule {
    name = float-vlc
    match:class = ^(vlc)$
    float = true
}

# TUI / management tools; float, size, center
windowrule {
    name = blueman-manager
    match:class = ^(blueman-manager)$
    float = true
    size = 800 600
    center = true
}
windowrule {
    name = impala
    match:class = ^(impala)$
    float = true
    size = 800 600
    center = true
}
windowrule {
    name = bluetui
    match:class = ^(bluetui)$
    float = true
    size = 800 600
    center = true
}
windowrule {
    name = btop
    match:class = ^(btop)$
    float = true
    size = 800 600
    center = true
}
windowrule {
    name = shedos-logs
    match:class = ^(shedos-logs)$
    float = true
    size = 1100 700
    center = true
}
windowrule {
    name = shedos-upgrade-history
    match:class = ^(shedos-upgrade-history)$
    float = true
    size = 1000 650
    center = true
}

# yad dialogs (used by `shedman install`).
# Without this rule Hyprland tiles them fullscreen, ignoring the
# --width / --height yad explicitly requests.
windowrule {
    name = yad
    match:class = ^[Yy]ad$
    float = true
    center = true
}

# Firefox Picture-in-Picture: float + pin
windowrule {
    name = firefox-pip
    match:class = ^(firefox)$
    match:title = ^(Picture-in-Picture)$
    float = true
    pin = true
}

# Floating terminal (Super+Shift+Return spawns kitty with this class).
windowrule {
    name = floating-terminal
    match:class = ^(floating-terminal)$
    float = true
    size = 1100 700
    center = true
}

# Terminal / editor opacity (active 0.95, inactive 0.9)
windowrule {
    name = kitty-opacity
    match:class = ^(kitty)$
    opacity = 0.95 0.9
}
windowrule {
    name = vscode-opacity
    match:class = ^(code-url-handler)$
    opacity = 0.95 0.9
}
