# ShedOS Hyprland decoration, animations, and layer rules.

decoration {
    rounding = 10

    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        xray = true
    }

    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(1e1e2eee)
    }
}

animations {
    enabled = true

    bezier = overshot, 0.05, 0.9, 0.1, 1.1
    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = smoothIn, 0.25, 1, 0.5, 1

    animation = windows, 1, 5, overshot, slide
    animation = windowsOut, 1, 4, smoothOut, slide
    animation = windowsMove, 1, 4, default
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 5, smoothIn
    animation = fadeDim, 1, 5, smoothIn
    animation = workspaces, 1, 6, overshot, slide
}

# Layer rules (wlr-layer-shell: walker, waybar, mako, etc.)

# Frosted backdrop for the walker launcher and its popovers
layerrule = blur on, match:namespace walker
layerrule = ignore_alpha 0.6, match:namespace walker

# Waybar + notifications also benefit from blur
layerrule = blur on, match:namespace waybar
layerrule = ignore_alpha 0.2, match:namespace waybar
layerrule = blur on, match:namespace notifications
layerrule = blur on, match:namespace mako

# Keep the screensaver overlay rendering above hyprlock (ext-session-lock-v1
# would otherwise hide every layer-shell surface during lock). First keypress
# dismisses the screensaver via its Exclusive keyboard grab; hyprlock then
# becomes visible underneath for password entry.
layerrule = abovelock 1, match:namespace shedos-screensaver
