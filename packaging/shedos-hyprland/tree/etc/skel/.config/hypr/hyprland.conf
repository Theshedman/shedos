# shedOS Hyprland Configuration
# Theme: Catppuccin Mocha

# ─────────────────────────────────────────────────────────────
# Environment Variables
# ─────────────────────────────────────────────────────────────

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# XDG
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = XDG_DATA_DIRS,/usr/local/share:/usr/share

# Locale
env = LANG,en_US.UTF-8
env = LANGUAGE,en_US:en
env = LC_ALL,en_US.UTF-8

# Qt
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1

# GTK
env = GDK_BACKEND,wayland,x11,*
env = GTK_THEME,Catppuccin-Mocha-Standard-Blue-Dark

# NVIDIA (uncomment if using NVIDIA)
# env = LIBVA_DRIVER_NAME,nvidia
# env = GBM_BACKEND,nvidia-drm
# env = __GLX_VENDOR_LIBRARY_NAME,nvidia
# env = NVD_BACKEND,direct

xwayland {
    force_zero_scaling = true
}

# Don't show ecosystem update
ecosystem {
    no_update_news = true
    no_donation_nag = true
}

# ─────────────────────────────────────────────────────────────
# Monitor Configuration
# ─────────────────────────────────────────────────────────────

# Default: auto-detect monitors
monitor = ,preferred,auto,1

# Example for specific monitors:
# monitor = DP-1,2560x1440@144,0x0,1
# monitor = HDMI-A-1,1920x1080@60,2560x0,1

# ─────────────────────────────────────────────────────────────
# Startup Applications
# ─────────────────────────────────────────────────────────────

# Apply GTK/icon/cursor theme via gsettings so apps that query
# org.gnome.desktop.interface (nautilus, GNOME Calendar, etc.) also pick
# up Catppuccin + Papirus icons. GTK3/4 apps read the same from
# ~/.config/gtk-{3,4}.0/settings.ini; this covers the rest.
exec-once = sh -c 'gsettings set org.gnome.desktop.interface icon-theme "Papirus-Dark"; gsettings set org.gnome.desktop.interface gtk-theme "Catppuccin-Mocha-Standard-Blue-Dark"; gsettings set org.gnome.desktop.interface cursor-theme "Adwaita"; gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"; gsettings set org.gnome.desktop.interface font-name "Inter 11"'

# Start elephant data provider for walker
exec-once = elephant &
exec-once = waybar
exec-once = gnome-keyring-daemon --start --components=secrets,pkcs11,ssh
exec-once = mako
exec-once = /usr/bin/shedos-user-session
exec-once = /usr/bin/shedman welcome
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = awww-daemon
exec-once = sleep 1 && awww img ~/.config/hypr/wallpapers/shedos_wallpaper_logo_4k.png
exec-once = hypridle
exec-once = hyprlock

# ─────────────────────────────────────────────────────────────
# Input Configuration
# ─────────────────────────────────────────────────────────────

input {
    kb_layout = us
    # Caps Lock behaves as Caps Lock (explicit default). Alternative remaps:
    #   kb_options = caps:escape        # Caps Lock → Escape (one-way, vim-friendly)
    #   kb_options = caps:swapescape    # Caps Lock ↔ Escape swap
    #   kb_options = caps:ctrl_modifier # Caps Lock → Ctrl (ergonomic swap)
    #   kb_options = caps:none          # Caps Lock disabled entirely
    kb_options = caps:capslock

    follow_mouse = 1

    touchpad {
        natural_scroll = true
        tap-to-click = true
        drag_lock = true
    }

    sensitivity = 0
    accel_profile = flat
}

# ─────────────────────────────────────────────────────────────
# General Settings
# ─────────────────────────────────────────────────────────────

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2

    # Catppuccin Mocha colors
    col.active_border = rgba(89b4faee) rgba(cba6f7ee) 45deg
    col.inactive_border = rgba(585b70aa)

    layout = dwindle
    allow_tearing = false
}

# ─────────────────────────────────────────────────────────────
# Decoration
# ─────────────────────────────────────────────────────────────

decoration {
    rounding = 10

    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        xray = true
    }

    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(1e1e2eee)
    }
}

# ─────────────────────────────────────────────────────────────
# Animations
# ─────────────────────────────────────────────────────────────

animations {
    enabled = true

    bezier = overshot, 0.05, 0.9, 0.1, 1.1
    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = smoothIn, 0.25, 1, 0.5, 1

    animation = windows, 1, 5, overshot, slide
    animation = windowsOut, 1, 4, smoothOut, slide
    animation = windowsMove, 1, 4, default
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 5, smoothIn
    animation = fadeDim, 1, 5, smoothIn
    animation = workspaces, 1, 6, overshot, slidevert
}

# ─────────────────────────────────────────────────────────────
# Layouts
# ─────────────────────────────────────────────────────────────

dwindle {
    pseudotile = true
    preserve_split = true
    force_split = 2
}

master {
    new_status = master
}

# ─────────────────────────────────────────────────────────────
# Miscellaneous
# ─────────────────────────────────────────────────────────────

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    vfr = true
    # Suppress: "Hyprland was started without start-hyprland. This is highly
    # not recommended." — SDDM's wayland-session wrapper re-execs via the
    # user's login shell, which can drop the --watchdog-fd Hyprland expects,
    # so the launch path LOOKS bare even when start-hyprland is in the chain.
    # The warning is cosmetic; crash-recovery watchdog is the only feature lost.
    disable_watchdog_warning = true
}

# ─────────────────────────────────────────────────────────────
# Window Rules
# ─────────────────────────────────────────────────────────────

# Hyprland 0.46+ replaced the comma-form `windowrule = ...` with block syntax.
# Each block has a unique `name`, one or more `match:<prop>` matchers, and
# action fields like float/center/size/opacity/pin.

# Simple floaters (no size/center)
windowrule {
    name = float-pavucontrol
    match:class = ^(pavucontrol)$
    float = true
}
windowrule {
    name = float-nm-connection-editor
    match:class = ^(nm-connection-editor)$
    float = true
}
windowrule {
    name = float-vlc
    match:class = ^(vlc)$
    float = true
}

# TUI / management tools — float, size, center
windowrule {
    name = blueman-manager
    match:class = ^(blueman-manager)$
    float = true
    size = 800 600
    center = true
}
windowrule {
    name = impala
    match:class = ^(impala)$
    float = true
    size = 800 600
    center = true
}
windowrule {
    name = bluetui
    match:class = ^(bluetui)$
    float = true
    size = 800 600
    center = true
}
windowrule {
    name = btop
    match:class = ^(btop)$
    float = true
    size = 800 600
    center = true
}
windowrule {
    name = shedos-logs
    match:class = ^(shedos-logs)$
    float = true
    size = 1100 700
    center = true
}
windowrule {
    name = shedos-upgrade-history
    match:class = ^(shedos-upgrade-history)$
    float = true
    size = 1000 650
    center = true
}

# ShedOS welcome dialog
windowrule {
    name = welcome-shedos
    match:title = ^(Welcome to ShedOS)$
    float = true
    size = 600 500
    center = true
}

# yad dialogs (used by `shedman install`, `shedman welcome`, etc.).
# Without this rule Hyprland tiles them fullscreen, ignoring the
# --width / --height yad explicitly requests.
windowrule {
    name = yad
    match:class = ^[Yy]ad$
    float = true
    center = true
}

# Firefox Picture-in-Picture: float + pin
windowrule {
    name = firefox-pip
    match:class = ^(firefox)$
    match:title = ^(Picture-in-Picture)$
    float = true
    pin = true
}

# Floating terminal (Super+Shift+Return spawns kitty with this class).
windowrule {
    name = floating-terminal
    match:class = ^(floating-terminal)$
    float = true
    size = 1100 700
    center = true
}

# Terminal / editor opacity (active 0.95, inactive 0.9)
windowrule {
    name = kitty-opacity
    match:class = ^(kitty)$
    opacity = 0.95 0.9
}
windowrule {
    name = vscode-opacity
    match:class = ^(code-url-handler)$
    opacity = 0.95 0.9
}

# ─────────────────────────────────────────────────────────────
# Layer Rules (wlr-layer-shell: walker, waybar, mako, etc.)
# ─────────────────────────────────────────────────────────────

# Frosted backdrop for the walker launcher and its popovers
layerrule = blur on, match:namespace walker
layerrule = ignore_alpha 0.6, match:namespace walker

# Waybar + notifications also benefit from blur
layerrule = blur on, match:namespace waybar
layerrule = ignore_alpha 0.2, match:namespace waybar
layerrule = blur on, match:namespace notifications
layerrule = blur on, match:namespace mako

# ─────────────────────────────────────────────────────────────
# Key Bindings
# ─────────────────────────────────────────────────────────────

$mainMod = SUPER

# Applications
bind = $mainMod, Return, exec, kitty
bind = $mainMod, D, exec, shedman launcher
bind = $mainMod, E, exec, nautilus
bind = $mainMod, B, exec, firefox
bind = $mainMod SHIFT, Return, exec, kitty --class=floating-terminal
bind = $mainMod ALT, J, exec, kitty --class=shedos-logs -e shedman logs
bind = $mainMod SHIFT, U, exec, kitty --class=shedos-upgrade-history -e shedman update --history

# Window Management
bind = $mainMod, Q, killactive,
bind = $mainMod, V, togglefloating,
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, M, fullscreen, 1
bind = $mainMod, P, pseudo,
bind = $mainMod, J, togglesplit,

# Focus
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod SHIFT, J, movefocus, d

# Move windows
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u

# Resize windows
bind = $mainMod CTRL, left, resizeactive, -50 0
bind = $mainMod CTRL, right, resizeactive, 50 0
bind = $mainMod CTRL, up, resizeactive, 0 -50
bind = $mainMod CTRL, down, resizeactive, 0 50
bind = $mainMod CTRL, H, resizeactive, -50 0
bind = $mainMod CTRL, L, resizeactive, 50 0
bind = $mainMod CTRL, K, resizeactive, 0 -50
bind = $mainMod CTRL, J, resizeactive, 0 50

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Mouse bindings
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Screenshots
bind = , Print, exec, grim -g "$(slurp)" - | swappy -f -
bind = SHIFT, Print, exec, grim - | swappy -f -
bind = $mainMod, Print, exec, grim -g "$(slurp)" ~/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png

# Screen Recording — shedman screenrecord toggles via walker prompt;
# Super+Shift+R stops the active recording (idempotent if none).
bind = $mainMod, R, exec, /usr/bin/shedman screenrecord
bind = $mainMod SHIFT, R, exec, /usr/bin/shedman screenrecord --stop

# Color Picker
bind = $mainMod SHIFT, P, exec, hyprpicker -a

# Clipboard history. The two `wl-paste --watch cliphist store` exec-once
# entries above feed cliphist's store; walker's elephant-clipboard provider
# renders the picker. Pressing Return on an item copies it back to the
# clipboard; paste with the usual Ctrl+V.
bind = $mainMod, C, exec, walker --provider clipboard

# Lock screen
bind = $mainMod, Escape, exec, hyprlock

# System controls
# Prefer hyprshutdown if the user installs it (e.g. as ~/.local/bin/hyprshutdown);
# otherwise fall back to `hyprctl dispatch exit` which is the upstream-recommended
# replacement for the bare `exit` dispatcher.
bind = $mainMod SHIFT, E, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
# Hyprland config reload — bound on Ctrl+Shift+R to leave Super+Shift+R for
# `shedman screenrecord --stop` (a chord users hit far more often).
bind = $mainMod SHIFT CTRL, R, exec, hyprctl reload

# Night Light
bind = $mainMod, F9, exec, /usr/bin/toggle-hyprsunset.sh

# Audio controls
# bindel = bind + e (repeat on hold) + l (fires even when session locked).
# Holding the + key ramps volume smoothly; mute/mic-mute still work on hyprlock.
bindel = , XF86AudioRaiseVolume, exec, pamixer -i 5
bindel = , XF86AudioLowerVolume, exec, pamixer -d 5
bindel = , XF86AudioMute,        exec, pamixer -t
bindel = , XF86AudioMicMute,     exec, pamixer --default-source -t

# Brightness controls (same repeat-on-hold + locked behavior)
bindel = , XF86MonBrightnessUp,   exec, brightnessctl set +5%
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Media controls
# bindl = bind + l (fires when locked) — so skip/pause works from hyprlock.
# No repeat needed; these are one-shot toggles.
bindl = , XF86AudioPlay,  exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioNext,  exec, playerctl next
bindl = , XF86AudioPrev,  exec, playerctl previous
