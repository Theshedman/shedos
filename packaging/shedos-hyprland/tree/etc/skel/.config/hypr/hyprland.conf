# ShedOS Hyprland configuration.
#
# Each concern lives in a focused file alongside this one. Edit the file
# you want without touching the rest. Add a new file by dropping it in
# this directory and adding a `source = ~/.config/hypr/<name>.conf` line
# below.

source = ~/.config/hypr/env.conf
source = ~/.config/hypr/monitor.conf
source = ~/.config/hypr/autostart.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/general.conf
source = ~/.config/hypr/decoration.conf
source = ~/.config/hypr/windowrules.conf
source = ~/.config/hypr/keybindings.conf
