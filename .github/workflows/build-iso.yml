name: build-iso

# Builds the ShedOS ISO on tag push (v*). The ISO itself (multi-GB) is
# published to R2 at https://repo.shedos.org/iso/ — GitHub Releases caps
# individual files at 2 GiB and our ISO is ~7.6 GiB, so only the SHA256SUMS
# + download-link release notes land on GitHub. Depends on the packages
# workflow having already published to R2.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  iso:
    runs-on: ubuntu-latest
    # R2_* secrets live in the SHEDOS_ENV environment.
    environment: SHEDOS_ENV
    # softprops/action-gh-release needs contents:write to create the tag's
    # Release page. Default GITHUB_TOKEN permissions vary by repo settings
    # (often read-only since 2023); spell it out so the ISO-build workflow
    # doesn't break if someone tightens the org default later.
    permissions:
      contents: write
    container:
      image: archlinux:latest
      options: --privileged
      # Mount the host root so we can free disk space before pacstrap.
      # ubuntu-latest ships ~30 GB of preinstalled toolchains we don't
      # need (dotnet, android-sdk, ghc, hostedtoolcache, …); pacstrap
      # filled the workspace partition before we trimmed them.
      volumes:
        - /:/host

    env:
      R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      R2_BUCKET: shedos-repo

    steps:
      - name: Free host disk space
        # Strip preinstalled toolchains we don't use so pacstrap has room.
        # Without this the workspace partition fills around package
        # ~390 of 433 (when shedos-meta + linux + linux-headers are unpacked).
        run: |
          df -h /__w || true
          rm -rf \
              /host/usr/share/dotnet \
              /host/usr/local/lib/android \
              /host/opt/ghc \
              /host/opt/hostedtoolcache \
              /host/usr/local/share/boost \
              /host/usr/local/share/powershell \
              /host/usr/share/swift \
              /host/opt/microsoft \
              /host/usr/lib/jvm \
              2>/dev/null || true
          df -h /__w || true

      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm
          # scdoc: shedos-system man pages. ccache: shedos-kernel build
          # (warm cache cuts kernel from ~2h45m → ~5min). python: needed
          # by `make` targets that the iso path may invoke.
          pacman -S --needed --noconfirm archiso base-devel git sudo rclone rsync grub scdoc ccache python
          # archlinux:latest ships an empty pacman keyring. Initialize +
          # populate the archlinux trust chain so makepkg --syncdeps (invoked
          # transitively by the AUR prebuild below) can verify signed
          # packages from core/extra.
          pacman-key --init
          pacman-key --populate archlinux
          # ccache wiring (system-wide, not user-scoped). build-shedos-
          # packages.sh creates and tears down a `builduser` inside its
          # run, which would erase /home/builduser/.ccache between runs;
          # placing the cache under /var/cache/shedos-ccache makes it
          # independent of that lifecycle. /etc/ccache.conf is read by any
          # user invoking ccache; /etc/makepkg.conf BUILDENV=(... ccache)
          # tells makepkg to prepend /usr/lib/ccache/bin to PATH so gcc/g++
          # invocations transparently route through ccache.
          mkdir -p /var/cache/shedos-ccache
          chmod 777 /var/cache/shedos-ccache
          cat > /etc/ccache.conf <<'EOF'
          cache_dir = /var/cache/shedos-ccache
          max_size = 5G
          EOF
          sed -i 's/^BUILDENV=.*/BUILDENV=(!distcc color !check !sign ccache)/' /etc/makepkg.conf
          sed -i 's/^#\?MAKEFLAGS=.*/MAKEFLAGS="-j$(nproc)"/' /etc/makepkg.conf

      - uses: actions/checkout@v4
        with:
          # fetch-tags + full depth so the release-notes step can find the
          # previous tag. On a tag push, fetch-tags defaults to false.
          fetch-depth: 0
          fetch-tags: true

      - name: Verify VERSION matches tag
        # Tags follow v<CalVer>[-rcN]. The VERSION file drives Calamares
        # branding (Makefile lines 212-215 use $(VERSION), not the tag-aware
        # $(ISO_VER)), so a stale VERSION ships an ISO whose installer UI
        # disagrees with the filename. Fail fast before we burn ~35 min on
        # AUR prebuilds + mkarchiso. Stable tags (v<CalVer>) must match
        # VERSION exactly; RC tags (v<CalVer>-rcN) match after stripping -rcN.
        # Skipped on workflow_dispatch from a branch — only tag builds ship.
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          expected="${tag%-rc*}"
          actual="$(cat VERSION)"
          if [[ "$expected" != "$actual" ]]; then
            echo "::error::VERSION file ($actual) disagrees with tag ($expected)."
            echo "Fix: bump VERSION to '$expected' and retag, or retag as v${actual}[-rcN]."
            exit 1
          fi
          echo "VERSION matches tag: $actual"

      - name: Render live-ISO pacman.conf channel
        # Stable tag (v<CalVer>, no -rcN) → /stable/. Anything else
        # (RC tag, branch push, workflow_dispatch) → /test/. The live
        # ISO's airootfs/etc/pacman.conf gets baked into the squashfs
        # by mkarchiso, so the substitution must happen BEFORE that.
        run: |
          channel="test"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]] && [[ "$GITHUB_REF_NAME" != *-rc* ]]; then
              channel="stable"
          fi
          echo "Rendering airootfs pacman.conf with channel=$channel"
          sed "s|@CHANNEL@|$channel|g" \
              archiso/airootfs/etc/pacman.conf.in \
              > archiso/airootfs/etc/pacman.conf

      - name: Restore ccache
        # Object-level compilation cache for the shedos-kernel build.
        # Keyed on the kernel PKGBUILD + config so a real source change
        # invalidates the cache, but a CI re-run with unchanged kernel
        # sources warm-hits and trims ~2 h off the build. Combined
        # restore+save (vs split) is fine here: a partial ccache is
        # always usable on the next run.
        # Same key shape as build-packages.yml so both workflows
        # populate / consume one cache.
        uses: actions/cache@v4
        with:
          path: /var/cache/shedos-ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('packaging/shedos-kernel/PKGBUILD', 'packaging/shedos-kernel/config.x86_64') }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Restore AUR package cache
        # Share one cache entry with build-packages.yml: same key shape,
        # same path (archiso/shedos-repo). Either workflow's successful
        # prebuild warms the cache for the other. Without this the ISO
        # build rebuilds ~38 AUR packages from source on every tag (~35 min
        # cold); with a cache hit it's near-instant.
        id: aur-cache
        uses: actions/cache/restore@v4
        with:
          path: archiso/shedos-repo
          key: aur-${{ runner.os }}-${{ hashFiles('packages/aur.txt') }}
          restore-keys: |
            aur-${{ runner.os }}-

      - name: Pre-build AUR dependencies
        # shedos-hyprland depends on oh-my-zsh-git etc.; shedos-branding on
        # catppuccin-sddm-theme-mocha. These must exist in the build-local
        # repo BEFORE `make shedos-packages` runs makepkg --syncdeps, else
        # dependency resolution fails. `make download-packages` invokes
        # scripts/build-aur-packages.sh which populates archiso/shedos-repo/.
        # With the cache restored above, unchanged packages skip rebuilds.
        run: make download-packages

      - name: Save AUR package cache
        # Save unconditionally when the cache key wasn't an exact hit, even
        # if later steps fail — mirrors the build-packages.yml pattern to
        # avoid discarding 35 min of prebuilt output on a downstream flake.
        if: always() && steps.aur-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: archiso/shedos-repo
          key: aur-${{ runner.os }}-${{ hashFiles('packages/aur.txt') }}

      - name: Restore shedos-kernel package cache
        # Whole-package cache keyed on the kernel PKGBUILD + config. When
        # upstream linux-zen pkgver hasn't bumped (scripts/bump-kernel.sh
        # rewrites the PKGBUILD on bumps) and the config is unchanged, the
        # last successful run's shedos-kernel-*.pkg.tar.zst is restored
        # here. The pre-flight in scripts/build-shedos-packages.sh sees
        # the file already in archiso/shedos-repo/ and skips makepkg
        # entirely (~30 s cache copy vs ~2 h 45 m fresh build).
        id: kernel-pkg-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/shedos-kernel-pkg-cache
          key: shedos-kernel-pkg-${{ runner.os }}-${{ hashFiles('packaging/shedos-kernel/PKGBUILD', 'packaging/shedos-kernel/config.x86_64') }}

      - name: Stage cached shedos-kernel package (or clear stale)
        # The AUR-cache restore step above may have brought back a
        # shedos-kernel-*.pkg.tar.zst with a stale pkgver-pkgrel — the
        # AUR cache key is hashFiles('packages/aur.txt'), which is
        # orthogonal to kernel state, so it can't be trusted to reflect
        # the current kernel sources. The dedicated kernel-pkg-cache is
        # the authoritative gate:
        #   * kernel-pkg-cache hit → wipe whatever AUR cache restored
        #     and lay down the cached kernel from /tmp.
        #   * kernel-pkg-cache miss → wipe whatever AUR cache restored
        #     so the script's pre-flight definitely fails the
        #     file-exists check and triggers a full makepkg rebuild.
        # Either way archiso/shedos-repo's kernel state matches the
        # current PKGBUILD.
        run: |
          mkdir -p archiso/shedos-repo
          rm -f archiso/shedos-repo/shedos-kernel-*.pkg.tar.zst
          if [[ "${{ steps.kernel-pkg-cache.outputs.cache-hit }}" == "true" ]]; then
              cp -v /tmp/shedos-kernel-pkg-cache/*.pkg.tar.zst archiso/shedos-repo/
              echo "Cached kernel staged; build-shedos-packages.sh pre-flight will skip rebuild."
          else
              echo "Kernel cache missed; build-shedos-packages.sh will rebuild from source."
          fi

      - name: Restore shedos-pkgs cache
        # Per-build incremental cache for non-kernel shedos-* packages.
        # Shares the cache prefix with build-packages.yml so a tag-pushed
        # ISO build hits whatever the most recent push-to-main saved.
        id: shedos-pkgs-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/shedos-pkg-cache
          key: shedos-pkgs-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            shedos-pkgs-${{ runner.os }}-

      - name: Stage cached shedos packages into shedos-repo
        run: |
          if [[ -d /tmp/shedos-pkg-cache ]]; then
              mkdir -p archiso/shedos-repo
              cp -v /tmp/shedos-pkg-cache/*.pkg.tar.zst archiso/shedos-repo/ 2>/dev/null || true
              cp -v /tmp/shedos-pkg-cache/*.pkg.tar.zst.sig archiso/shedos-repo/ 2>/dev/null || true
              echo "Staged cached shedos packages from /tmp/shedos-pkg-cache."
          else
              echo "shedos-pkgs cache empty; build-shedos-packages.sh will build from source."
          fi

      - name: Resolve shedos-meta Arch closure
        # Regenerates packages/.meta-closure.txt against the runner's
        # fresh pacman db so render-meta-depends.sh (called by `make
        # shedos-packages` below) sees the current closure. Runs as
        # root — pacman -Sy needs it.
        run: bash scripts/resolve-meta-closure.sh

      - name: Build ShedOS native packages
        # Populates archiso/shedos-repo with shedos-meta + deps so pacstrap
        # can resolve them from the build-local repo. Also refreshes
        # shedos-meta's depends= from packages/.
        run: make shedos-packages

      - name: Stage shedos-kernel package for cache save
        # If we just rebuilt the kernel, mirror it into the kernel-pkg-cache
        # path so the save step below pushes it to the GHA cache. No-op on
        # cache hit — same files would be copied to themselves.
        if: always() && steps.kernel-pkg-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/shedos-kernel-pkg-cache
          cp -v archiso/shedos-repo/shedos-kernel-*.pkg.tar.zst \
              /tmp/shedos-kernel-pkg-cache/ 2>/dev/null || true
          ls -la /tmp/shedos-kernel-pkg-cache/

      - name: Save shedos-kernel package cache
        # Persist the freshly-built kernel for the next run. Only saves on
        # cache miss — a hit means the cache already has these files. Use
        # `if: always()` so a downstream failure (ISO build, R2 upload)
        # doesn't discard the kernel build we just spent ~3 h on.
        if: always() && steps.kernel-pkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/shedos-kernel-pkg-cache
          key: shedos-kernel-pkg-${{ runner.os }}-${{ hashFiles('packaging/shedos-kernel/PKGBUILD', 'packaging/shedos-kernel/config.x86_64') }}

      - name: Stage shedos packages for cache save
        # Mirror non-kernel shedos-*.pkg.tar.zst into the cache path so
        # the next run's pre-flight can skip unchanged packages. Kernel
        # files belong to the dedicated kernel cache; skip them here.
        # Prune stale versions first so the cache doesn't accumulate
        # every old pkgrel ever built.
        if: always()
        run: |
          mkdir -p /tmp/shedos-pkg-cache
          shopt -s nullglob
          for dir in packaging/shedos-*/; do
              pkgname=$(basename "$dir")
              [[ -f "$dir/PKGBUILD" ]] || continue
              [[ "$pkgname" == "shedos-kernel" ]] && continue
              pkgver=$(awk -F= '/^pkgver=/ {print $2; exit}' "$dir/PKGBUILD")
              pkgrel=$(awk -F= '/^pkgrel=/ {print $2; exit}' "$dir/PKGBUILD")
              for stale in /tmp/shedos-pkg-cache/${pkgname}-*.pkg.tar.zst; do
                  base=$(basename "$stale")
                  [[ "$base" == "${pkgname}-${pkgver}-${pkgrel}-"*.pkg.tar.zst ]] && continue
                  echo "  cache prune: $base"
                  rm -f "$stale" "${stale}.sig"
              done
          done
          for f in archiso/shedos-repo/shedos-*.pkg.tar.zst; do
              case "$(basename "$f")" in
                  shedos-kernel-*) continue ;;
              esac
              cp -v "$f" /tmp/shedos-pkg-cache/
              [[ -f "${f}.sig" ]] && cp -v "${f}.sig" /tmp/shedos-pkg-cache/
          done
          ls -la /tmp/shedos-pkg-cache/ | head -20

      - name: Save shedos-pkgs cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /tmp/shedos-pkg-cache
          key: shedos-pkgs-${{ runner.os }}-${{ github.sha }}

      - name: Strip debug packages from shedos-repo
        run: |
          rm -f archiso/shedos-repo/*-debug-*.pkg.tar.zst archiso/shedos-repo/*-debug-*.pkg.tar.zst.sig
          cd archiso/shedos-repo
          shopt -s nullglob
          pkgs=( *.pkg.tar.zst )
          if (( ${#pkgs[@]} > 0 )); then
              # No -R: the rm above already removed the debug files; -R
              # would try to remove "old" package files for non-debug
              # entries it considers superseded, which fails when those
              # files are missing. -n skips re-adding existing entries;
              # -p prevents lex-order downgrade as in _refresh_repo_db.
              repo-add -n -p shedos-repo.db.tar.gz "${pkgs[@]}"
          fi

      - name: Build ISO
        env:
          # Strip the leading "v" from the tag so the ISO filename is
          # shedos-2026.04.21-rc2-x86_64.iso (not shedos-v2026.04.21-rc2-…).
          # Makefile's ISO_VER picks this up and feeds it to profiledef.sh.
          SHEDOS_ISO_TAG: ${{ github.ref_name }}
        run: |
          # github.ref_name is the full tag (e.g. v2026.04.21-rc2); strip "v".
          export SHEDOS_ISO_TAG="${SHEDOS_ISO_TAG#v}"
          make iso SHEDOS_ISO_TAG="$SHEDOS_ISO_TAG"
          ls -la out/

      - name: Compute checksum
        run: |
          cd out
          ISO_NAME=$(ls shedos-*.iso | head -1)
          # Per-file .sha256 (vs a single SHA256SUMS): with a flat /iso/
          # layout, a global SHA256SUMS would overwrite on every release.
          # <iso>.sha256 is self-scoped and matches `sha256sum -c` UX.
          sha256sum "$ISO_NAME" > "${ISO_NAME}.sha256"
          echo "ISO_NAME=$ISO_NAME" >> "$GITHUB_ENV"

      - name: Upload ISO to R2
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ env.R2_ENDPOINT }}
          RCLONE_CONFIG_R2_REGION: auto
          # R2 API tokens scoped to a single bucket don't have CreateBucket
          # permission; skip rclone's pre-flight probe (same trick as
          # build-packages.yml's Publish to R2 step).
          RCLONE_S3_NO_CHECK_BUCKET: "true"
        run: |
          # Flat layout: r2:shedos-repo/iso/shedos-<ver>-x86_64.iso
          # Uniqueness comes from the filename itself (tag → ISO_VER), so
          # successive releases don't overwrite and the browser download
          # filename matches the on-disk name.
          rclone copy "out/$ISO_NAME" "r2:$R2_BUCKET/iso/" --progress
          rclone copy "out/${ISO_NAME}.sha256" "r2:$R2_BUCKET/iso/"

      - name: Retention sweep
        # Keep 2 stables + 1 RC on R2 (plus their .sha256 siblings). Rolling
        # release = nobody wants older ISOs post-install; previous-stable is
        # kept purely as a rollback lifeline if the newest stable ships broken.
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ env.R2_ENDPOINT }}
          RCLONE_CONFIG_R2_REGION: auto
          RCLONE_S3_NO_CHECK_BUCKET: "true"
        run: |
          KEEP_STABLES=2
          KEEP_RCS=1

          # One-time cleanup of the old nested layout from the rc1 era
          # (/iso/v<tag>/<file>). Safe to run every time — `rclone purge` on
          # a non-existent path is a no-op with this flag set. Drop this step
          # once no v*/ prefixes remain in the bucket.
          for legacy in $(rclone lsf "r2:$R2_BUCKET/iso/" --dirs-only 2>/dev/null \
                         | grep -E '^v[0-9]' || true); do
              echo "purging legacy nested layout: iso/$legacy"
              rclone purge "r2:$R2_BUCKET/iso/$legacy" || true
          done

          # `sort -V` so rc8 < rc9 < rc10 — plain sort is lexicographic.
          mapfile -t all_isos < <(
              rclone lsf "r2:$R2_BUCKET/iso/" --files-only \
                  --include 'shedos-*-x86_64.iso' | sort -V
          )

          stables=() rcs=()
          for f in "${all_isos[@]}"; do
              if [[ $f == *-rc*-x86_64.iso ]]; then
                  rcs+=("$f")
              else
                  stables+=("$f")
              fi
          done

          # Lexicographic sort on CalVer filenames puts newest last, so
          # "everything except the tail N" is what we delete.
          _sweep() {
              local keep=$1; shift
              local -a list=("$@")
              local drop=$(( ${#list[@]} - keep ))
              (( drop <= 0 )) && return
              for f in "${list[@]:0:$drop}"; do
                  echo "retention: dropping $f (and .sha256)"
                  rclone deletefile "r2:$R2_BUCKET/iso/$f" || true
                  rclone deletefile "r2:$R2_BUCKET/iso/${f}.sha256" || true
              done
          }
          _sweep "$KEEP_STABLES" "${stables[@]}"
          _sweep "$KEEP_RCS"     "${rcs[@]}"

          echo "--- /iso/ after sweep ---"
          rclone lsf "r2:$R2_BUCKET/iso/" --files-only | sort -V

      - name: Generate release notes
        # Group commits since the previous tag by Conventional Commit type so
        # the GitHub Release body shows a human-readable changelog instead of
        # a fixed template. Output exposed as $RELEASE_NOTES (multiline env
        # var) + $PREV_TAG (for the compare link).
        run: |
          prev_tag=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [[ -z $prev_tag ]]; then
              range=HEAD
              since="initial commit"
          else
              range="${prev_tag}..HEAD"
              since="$prev_tag"
          fi

          # Conventional Commits convention used across this repo:
          # feat | fix | perf | revert | docs | ci | chore | release
          # `release:` commits are pure version bumps — drop them. Everything
          # else buckets by type; unrecognised prefixes land in "Other".
          mapfile -t subjects < <(git log "$range" --no-merges --pretty='%s' \
              | grep -Ev '^(release|chore\(release\)):' || true)

          declare -A bucket_title=(
              [feat]="### New features"
              [fix]="### Fixes"
              [perf]="### Performance"
              [revert]="### Reverts"
              [docs]="### Documentation"
              [ci]="### CI / tooling"
              [chore]="### Chores"
          )
          declare -A bucket
          other=""

          for line in "${subjects[@]}"; do
              if [[ $line =~ ^([a-z]+)(\([^\)]+\))?!?:[[:space:]] ]]; then
                  type="${BASH_REMATCH[1]}"
                  if [[ -n ${bucket_title[$type]:-} ]]; then
                      bucket[$type]+="- ${line}"$'\n'
                      continue
                  fi
              fi
              other+="- ${line}"$'\n'
          done

          {
              echo "RELEASE_NOTES<<SHEDOS_EOF"
              wrote=0
              for type in feat fix perf revert docs ci chore; do
                  if [[ -n ${bucket[$type]:-} ]]; then
                      echo "${bucket_title[$type]}"
                      echo
                      printf '%s\n' "${bucket[$type]}"
                      wrote=1
                  fi
              done
              if [[ -n $other ]]; then
                  echo "### Other"
                  echo
                  printf '%s\n' "$other"
                  wrote=1
              fi
              (( wrote )) || echo "_No user-visible changes since ${since}._"
              echo "SHEDOS_EOF"
          } >> "$GITHUB_ENV"

          echo "PREV_TAG=$prev_tag" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        # GitHub Releases caps files at 2 GiB — our ISO is ~7.6 GiB. Attach
        # only the per-file .sha256 + point at R2 in the body. The Release
        # itself is still the canonical "what's in tag vX" pin.
        uses: softprops/action-gh-release@v2
        with:
          # Tag convention: v<CalVer>       → stable release
          #                 v<CalVer>-rcN   → prerelease (user-reviewed RC)
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          files: out/${{ env.ISO_NAME }}.sha256
          body: |
            ## ShedOS ${{ github.ref_name }}

            **ISO download:** https://repo.shedos.org/iso/${{ env.ISO_NAME }}
            **Checksum:** https://repo.shedos.org/iso/${{ env.ISO_NAME }}.sha256 (attached below for convenience)

            Verify after download:
            ```
            sha256sum -c ${{ env.ISO_NAME }}.sha256
            ```

            ## What's new${{ env.PREV_TAG && format(' since {0}', env.PREV_TAG) || '' }}

            ${{ env.RELEASE_NOTES }}

            ${{ env.PREV_TAG && format('**Full diff:** https://github.com/{0}/compare/{1}...{2}', github.repository, env.PREV_TAG, github.ref_name) || '' }}

            ### Upgrading an existing ShedOS system
            You don't need this ISO to upgrade. Click the waybar update icon
            or run `shedos-update` — `pacman -Syu` pulls signed packages
            directly from `repo.shedos.org`.
