name: build-iso

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: iso-publish
  cancel-in-progress: false

jobs:
  iso:
    runs-on: ubuntu-latest
    environment: SHEDOS_ENV
    permissions:
      contents: write
    container:
      image: archlinux:latest
      options: --privileged
      volumes:
        - /usr:/host/usr
        - /opt:/host/opt
        - /mnt:/mnt

    env:
      R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      R2_BUCKET: shedos-repo

    steps:
      - name: Free host disk space
        run: |
          df -h /__w || true
          rm -rf \
              /host/usr/share/dotnet \
              /host/usr/local/lib/android \
              /host/opt/ghc \
              /host/opt/hostedtoolcache \
              /host/usr/local/share/boost \
              /host/usr/local/share/powershell \
              /host/usr/share/swift \
              /host/opt/microsoft \
              /host/usr/lib/jvm \
              2>/dev/null || true
          df -h /__w || true

      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm archiso base-devel git sudo rclone rsync grub scdoc python
          # archlinux:latest ships an empty keyring; makepkg --syncdeps needs the trust chain
          pacman-key --init
          pacman-key --populate archlinux
          sed -i 's/^BUILDENV=.*/BUILDENV=(!distcc color !check !sign)/' /etc/makepkg.conf
          sed -i 's/^#\?MAKEFLAGS=.*/MAKEFLAGS="-j$(nproc)"/' /etc/makepkg.conf

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # full depth + tags so the release-notes step can find the previous tag
          fetch-depth: 0
          fetch-tags: true

      - name: Trust workspace for git
        # container uid differs from the checkout owner; avoids git "dubious ownership"
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Validate release-hashes manifest
        run: bash scripts/bump-version.sh --check

      - name: Verify VERSION matches tag
        # stale VERSION ships an ISO whose Calamares branding disagrees with the filename
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          expected="${tag%-rc*}"
          actual="$(cat VERSION)"
          if [[ "$expected" != "$actual" ]]; then
            echo "::error::VERSION file ($actual) disagrees with tag ($expected)."
            echo "Fix: bump VERSION to '$expected' and retag, or retag as v${actual}[-rcN]."
            exit 1
          fi
          echo "VERSION matches tag: $actual"

      - name: Bake the release channel into the ISO
        # marker rides the squashfs into installs; shedos-system points [shedos] at it
        run: |
          channel="test"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]] && [[ "$GITHUB_REF_NAME" != *-rc* ]]; then
              channel="stable"
          fi
          echo "Baking channel=$channel"
          install -d archiso/airootfs/etc/shedos
          printf '%s\n' "$channel" > archiso/airootfs/etc/shedos/channel
          cp archiso/airootfs/etc/pacman.conf.in \
             archiso/airootfs/etc/pacman.conf

      - name: Restore AUR package cache
        # shares the cache entry with build-packages.yml so either workflow warms the other
        id: aur-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: archiso/shedos-repo
          key: aur-${{ runner.os }}-${{ hashFiles('packages/aur.txt') }}
          restore-keys: |
            aur-${{ runner.os }}-

      - name: Pre-build AUR dependencies
        # AUR deps must be in the build-local repo before make shedos-packages resolves deps
        env:
          # fail on an unfetchable PGP key instead of warn-and-skip
          SHEDOS_AUR_STRICT_PGP: '1'
        run: make download-packages

      - name: Save AUR package cache
        # save on miss even if later steps fail, so a downstream flake doesn't discard the build
        if: always() && steps.aur-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: archiso/shedos-repo
          key: aur-${{ runner.os }}-${{ hashFiles('packages/aur.txt') }}

      - name: Restore shedos-pkgs cache
        # shares the cache prefix with build-packages.yml's most recent push-to-main save
        id: shedos-pkgs-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: /tmp/shedos-pkg-cache
          key: shedos-pkgs-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            shedos-pkgs-${{ runner.os }}-

      - name: Stage cached shedos packages into shedos-repo
        # skip .sig files: the iso runner lacks the signing key, so pacstrap would fail to verify
        run: |
          if [[ -d /tmp/shedos-pkg-cache ]]; then
              mkdir -p archiso/shedos-repo
              cp -v /tmp/shedos-pkg-cache/*.pkg.tar.zst archiso/shedos-repo/ 2>/dev/null || true
              echo "Staged cached shedos packages from /tmp/shedos-pkg-cache."
          else
              echo "shedos-pkgs cache empty; build-shedos-packages.sh will build from source."
          fi

      - name: Resolve shedos-meta Arch closure
        run: bash scripts/resolve-meta-closure.sh

      - name: Build ShedOS native packages
        run: make shedos-packages

      - name: Stage shedos packages for cache save
        id: shedos-pkgs-stage
        if: always()
        run: |
          mkdir -p /tmp/shedos-pkg-cache
          shopt -s nullglob
          declare -A keep_pkgs=()
          for dir in packaging/*/; do
              [[ -f "$dir/PKGBUILD" ]] || continue
              name=$(basename "$dir")
              keep_pkgs[$name]=1
          done
          for dir in packaging/*/; do
              pkgname=$(basename "$dir")
              [[ -f "$dir/PKGBUILD" ]] || continue
              pkgver=$(awk -F= '/^pkgver=/ {print $2; exit}' "$dir/PKGBUILD")
              pkgrel=$(awk -F= '/^pkgrel=/ {print $2; exit}' "$dir/PKGBUILD")
              for stale in /tmp/shedos-pkg-cache/${pkgname}-*.pkg.tar.zst; do
                  base=$(basename "$stale")
                  [[ "$base" == "${pkgname}-${pkgver}-${pkgrel}-"*.pkg.tar.zst ]] && continue
                  [[ "$base" == "${pkgname}-debug-${pkgver}-${pkgrel}-"*.pkg.tar.zst ]] && continue
                  echo "  cache prune: $base"
                  rm -f "$stale" "${stale}.sig"
              done
          done
          has_files=0
          for f in archiso/shedos-repo/*.pkg.tar.zst; do
              base=$(basename "$f")
              pkgname=${base%-*-*-*.pkg.tar.zst}
              parent=${pkgname%-debug}
              [[ -n ${keep_pkgs[$parent]:-} ]] || continue
              cp -v "$f" /tmp/shedos-pkg-cache/
              [[ -f "${f}.sig" ]] && cp -v "${f}.sig" /tmp/shedos-pkg-cache/
              has_files=1
          done
          ls -la /tmp/shedos-pkg-cache/ | head -20
          echo "has_files=$has_files" >> "$GITHUB_OUTPUT"

      - name: Save shedos-pkgs cache
        # has_files gate: an empty cache would shadow a healthy one via restore-keys prefix match
        if: always() && steps.shedos-pkgs-stage.outputs.has_files == '1'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: /tmp/shedos-pkg-cache
          key: shedos-pkgs-${{ runner.os }}-${{ github.sha }}

      - name: Strip debug packages from shedos-repo
        run: |
          rm -f archiso/shedos-repo/*-debug-*.pkg.tar.zst archiso/shedos-repo/*-debug-*.pkg.tar.zst.sig
          cd archiso/shedos-repo
          shopt -s nullglob
          pkgs=( *.pkg.tar.zst )
          if (( ${#pkgs[@]} > 0 )); then
              # no -R: it would fail trying to remove the debug files rm already deleted
              repo-add -n -p shedos-repo.db.tar.gz "${pkgs[@]}"
          fi

      - name: Refresh pacman cache with locally-built packages
        # overwrite stale cached pkgs whose sha256 no longer matches the rebuilt repo.db
        run: |
          if [[ -d /var/cache/pacman/pkg ]]; then
              cp -fv archiso/shedos-repo/*.pkg.tar.zst /var/cache/pacman/pkg/ 2>/dev/null || true
          fi

      - name: Build ISO
        env:
          SHEDOS_ISO_TAG: ${{ github.ref_name }}
        run: |
          export SHEDOS_ISO_TAG="${SHEDOS_ISO_TAG#v}"
          # Build the work tree on /mnt (~74G), not /__w (~43G), so the
          # airootfs + squashfs don't run mkarchiso out of space.
          mkdir -p /mnt/archiso-work
          df -h /mnt /__w || true
          make iso WORK_DIR=/mnt/archiso-work SHEDOS_ISO_TAG="$SHEDOS_ISO_TAG"
          ls -la out/

      - name: Compute checksum
        run: |
          cd out
          ISO_NAME=$(ls shedos-*.iso | head -1)
          # per-file .sha256: a global SHA256SUMS would overwrite on the flat /iso/ layout
          sha256sum "$ISO_NAME" > "${ISO_NAME}.sha256"
          echo "ISO_NAME=$ISO_NAME" >> "$GITHUB_ENV"

      - name: Boot-assert the ISO
        run: |
          pacman -S --needed --noconfirm qemu-base libarchive util-linux
          scripts/boot-assert.sh "out/$ISO_NAME"

      - name: Build the base install image
        # non-blocking so a build failure can't stop publishing
        continue-on-error: true
        run: |
          pacman -S --needed --noconfirm edk2-ovmf libguestfs squashfs-tools \
            socat libisoburn btrfs-progs dosfstools gptfdisk limine \
            arch-install-scripts qemu-img binutils
          modprobe loop || true
          # Build on /mnt (~74G), not out/ on /__w (~43G, already holding the ISO
          # + caches), so the 16G scratch image and its qcow2 don't run out of
          # space. The archiso work tree is spent once the ISO is in out/.
          rm -rf /mnt/archiso-work
          TMPDIR=/mnt SHEDOS_ISO="out/$ISO_NAME" SHEDOS_BASE_IMAGE_OUT=/mnt/base.qcow2 \
            scripts/build-base-image.sh

      # TEMPORARY diagnostic: capture the freshly-built image's boot layout so we
      # can see why the emergency drill can't find the UKI. Remove once fixed.
      - name: Dump base-image boot layout
        if: always()
        continue-on-error: true
        run: |
          [ -f /mnt/base.qcow2 ] || { echo "no /mnt/base.qcow2 (base build failed)"; exit 0; }
          out=out/base-boot-layout.txt
          guestfish --ro -a /mnt/base.qcow2 -i <<'GF' > "$out" 2>&1 || true
          echo "=== mountpoints ==="
          mountpoints
          echo "=== /boot (depth 2) ==="
          find /boot -maxdepth 2
          echo "=== /boot/efi ==="
          find /boot/efi
          echo "=== limine.conf variants ==="
          sh "for f in /boot/limine.conf /boot/efi/EFI/limine/limine.conf /boot/efi/limine.conf /efi/EFI/limine/limine.conf /efi/limine.conf; do echo \"### $f ###\"; [ -f \"$f\" ] && cat \"$f\" || echo '(absent)'; echo; done"
          echo "=== /etc/fstab ==="
          cat /etc/fstab
          GF
          echo "===== base-boot-layout.txt ====="
          cat "$out"

      - name: Upload base-image boot layout
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: base-boot-layout
          path: out/base-boot-layout.txt
          if-no-files-found: warn

      - name: Emergency-recovery gate
        # non-blocking so a failure can't stop publishing
        continue-on-error: true
        run: |
          # A SKIP (exit 77) means a prerequisite is missing, not a failure —
          # map it to success so it doesn't red-annotate this advisory gate.
          SHEDOS_EMERGENCY_TEST_IMAGE=/mnt/base.qcow2 scripts/emergency-boot-assert.sh \
            || { rc=$?; [ "$rc" -eq 77 ] && exit 0 || exit "$rc"; }

      - name: Live + installed lock gate
        # non-blocking so a failure can't stop publishing
        continue-on-error: true
        run: |
          # Arch splits qemu's display backends: -display egl-headless lives in
          # qemu-ui-egl-headless, the virtio-gpu-gl-pci device in its own modules
          # (the -pci-gl leaf needs the -pci base), and virglrenderer/mesa back
          # the GL. GPU-less runners still SKIP at the render-node guard.
          pacman -S --needed --noconfirm qemu-ui-egl-headless virglrenderer mesa \
            libglvnd qemu-hw-display-virtio-gpu-pci-gl qemu-hw-display-virtio-gpu-pci
          # A SKIP (exit 77) means a prerequisite is missing (a GPU-less runner
          # can't bring up the desktop), not a failure — map it to success so it
          # doesn't red-annotate this advisory gate.
          SHEDOS_LIVE_ISO="out/$ISO_NAME" SHEDOS_INSTALLED_IMAGE=/mnt/base.qcow2 \
            scripts/live-iso-lock-assert.sh \
            || { rc=$?; [ "$rc" -eq 77 ] && exit 0 || exit "$rc"; }

      - name: Upload lock-harness artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lock-harness-artifacts
          path: out/lock-artifacts/*
          if-no-files-found: ignore

      - name: Upload ISO to R2
        # tag-only: an untagged build's shedos-main iso would sort last and evict a real stable
        if: github.ref_type == 'tag'
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ env.R2_ENDPOINT }}
          RCLONE_CONFIG_R2_REGION: auto
          # single-bucket R2 tokens lack CreateBucket; skip rclone's pre-flight probe
          RCLONE_S3_NO_CHECK_BUCKET: "true"
        run: |
          rclone copy "out/$ISO_NAME" "r2:$R2_BUCKET/iso/" --progress
          rclone copy "out/${ISO_NAME}.sha256" "r2:$R2_BUCKET/iso/"

      - name: Retention sweep
        # tag-only: an untagged build's shedos-main iso would sort last and evict a real stable
        if: github.ref_type == 'tag'
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ env.R2_ENDPOINT }}
          RCLONE_CONFIG_R2_REGION: auto
          RCLONE_S3_NO_CHECK_BUCKET: "true"
        run: |
          KEEP_STABLES=2
          KEEP_RCS=1

          # one-time cleanup of the old rc1-era nested layout; drop once no v*/ prefixes remain
          for legacy in $(rclone lsf "r2:$R2_BUCKET/iso/" --dirs-only 2>/dev/null \
                         | grep -E '^v[0-9]' || true); do
              echo "purging legacy nested layout: iso/$legacy"
              rclone purge "r2:$R2_BUCKET/iso/$legacy" || true
          done

          # sort -V so rc8 < rc9 < rc10
          mapfile -t all_isos < <(
              rclone lsf "r2:$R2_BUCKET/iso/" --files-only \
                  --include 'shedos-*-x86_64.iso' | sort -V
          )

          stables=() rcs=()
          for f in "${all_isos[@]}"; do
              if [[ $f == *-rc*-x86_64.iso ]]; then
                  rcs+=("$f")
              else
                  stables+=("$f")
              fi
          done

          # newest sorts last, so we delete everything except the tail N
          _sweep() {
              local keep=$1; shift
              local -a list=("$@")
              local drop=$(( ${#list[@]} - keep ))
              (( drop <= 0 )) && return
              for f in "${list[@]:0:$drop}"; do
                  echo "retention: dropping $f (and .sha256)"
                  rclone deletefile "r2:$R2_BUCKET/iso/$f" || true
                  rclone deletefile "r2:$R2_BUCKET/iso/${f}.sha256" || true
              done
          }
          _sweep "$KEEP_STABLES" "${stables[@]}"
          _sweep "$KEEP_RCS"     "${rcs[@]}"

          echo "--- /iso/ after sweep ---"
          rclone lsf "r2:$R2_BUCKET/iso/" --files-only | sort -V

      - name: Generate release notes
        if: github.ref_type == 'tag'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch origin --tags --force --no-recurse-submodules 2>/dev/null || true

          # rc spans to the previous tag; stable spans to the previous stable so rc notes roll up
          if [[ "$GITHUB_REF_NAME" == *-rc* ]]; then
              prev_tag=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          else
              prev_tag=$(git tag --list --sort=-version:refname --merged HEAD^ \
                  'v[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]' \
                  | head -1)
          fi

          if [[ -z $prev_tag ]]; then
              range=HEAD
              since="initial commit"
          else
              range="${prev_tag}..HEAD"
              since="$prev_tag"
          fi

          # drop pure version-bump commits; unrecognised prefixes land in "Other"
          mapfile -t subjects < <(git log "$range" --no-merges --pretty='%s' \
              | grep -Ev '^(release|chore\(release\)):' || true)

          declare -A bucket_title=(
              [feat]="### New features"
              [fix]="### Fixes"
              [perf]="### Performance"
              [revert]="### Reverts"
              [docs]="### Documentation"
              [ci]="### CI / tooling"
              [chore]="### Chores"
          )
          declare -A bucket
          other=""

          for line in "${subjects[@]}"; do
              if [[ $line =~ ^([a-z]+)(\([^\)]+\))?!?:[[:space:]] ]]; then
                  type="${BASH_REMATCH[1]}"
                  if [[ -n ${bucket_title[$type]:-} ]]; then
                      bucket[$type]+="- ${line}"$'\n'
                      continue
                  fi
              fi
              other+="- ${line}"$'\n'
          done

          {
              echo "RELEASE_NOTES<<SHEDOS_EOF"
              wrote=0
              for type in feat fix perf revert docs ci chore; do
                  if [[ -n ${bucket[$type]:-} ]]; then
                      echo "${bucket_title[$type]}"
                      echo
                      printf '%s\n' "${bucket[$type]}"
                      wrote=1
                  fi
              done
              if [[ -n $other ]]; then
                  echo "### Other"
                  echo
                  printf '%s\n' "$other"
                  wrote=1
              fi
              (( wrote )) || echo "_No user-visible changes since ${since}._"
              echo "SHEDOS_EOF"
          } >> "$GITHUB_ENV"

          echo "PREV_TAG=$prev_tag" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        # tag-only: an untagged build's shedos-main iso would sort last and evict a real stable
        if: github.ref_type == 'tag'
        # ISO exceeds GitHub's per-file limit; attach only the .sha256 and point at R2
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          files: out/${{ env.ISO_NAME }}.sha256
          body: |
            ## ShedOS ${{ github.ref_name }}

            **ISO download:** https://repo.shedos.org/iso/${{ env.ISO_NAME }}
            **Checksum:** https://repo.shedos.org/iso/${{ env.ISO_NAME }}.sha256 (attached below for convenience)

            Verify after download:
            ```
            sha256sum -c ${{ env.ISO_NAME }}.sha256
            ```

            ## What's new${{ env.PREV_TAG && format(' since {0}', env.PREV_TAG) || '' }}

            ${{ env.RELEASE_NOTES }}

            ${{ env.PREV_TAG && format('**Full diff:** https://github.com/{0}/compare/{1}...{2}', github.repository, env.PREV_TAG, github.ref_name) || '' }}

            ### Upgrading an existing ShedOS system
            You don't need this ISO to upgrade. Click the waybar update icon
            or run `shedman update` — `pacman -Syu` pulls signed packages
            directly from `repo.shedos.org`.
