name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  shell-suites:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install test dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm \
            base-devel git sudo \
            python python-pytest python-textual python-tomlkit jq scdoc zsh fish man-db \
            rust clang wayland libxkbcommon alsa-lib pam

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Trust workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build the screensaver (its suite tests the real binary)
        run: |
          useradd -m tester
          chown -R tester:tester .
          sudo -u tester bash -c 'cd packaging/shedos-screensaver && cargo build'

      - name: Run the Rust unit suites
        run: |
          sudo -u tester bash -c '
            set -e
            for crate in packaging/shedos-screensaver packaging/shedos-prompt-ui \
                         packaging/shedos-greeter packaging/shedos-power \
                         packaging/shedos-tour packaging/shedos-switcher; do
                echo "---- cargo test $crate ----"
                (cd "$crate" && cargo test --locked)
            done'

      - name: Run shell test suites
        run: sudo -u tester bash scripts/run-shell-tests.sh

      # The rotation drill needs root (pacman-key/pacman -Sy) but no privileged
      # container — it runs against a scratch file:// repo, not loop devices. It
      # SKIPs as the tester above, so run it here as root for the real assertions.
      - name: Run the rotation drill (real pacman signer swap, root)
        run: bash test/rotation-drill/run.sh

      - name: Run the installer Python suite
        run: sudo -u tester bash -c 'PYTHONPATH=installer python -m pytest installer/tests -q'
