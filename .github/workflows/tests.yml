name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  shell-suites:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install test dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm \
            base-devel git sudo \
            python python-textual python-tomlkit jq scdoc zsh fish man-db \
            rust clang wayland libxkbcommon alsa-lib pam

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Trust workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # The suites run unprivileged — the tools refuse root, and each suite
      # stubs the privileged surface (pacman/systemctl/snapper/ufw/yad) and
      # redirects its surface roots, so nothing touches the container.
      - name: Build the screensaver (its suite tests the real binary)
        run: |
          useradd -m tester
          chown -R tester:tester .
          sudo -u tester bash -c 'cd packaging/shedos-screensaver && cargo build'

      - name: Run the Rust unit suites
        # Every crate with tests: the screensaver workspace plus the
        # single-crate overlays. Locked so CI never resolves new deps.
        run: |
          sudo -u tester bash -c '
            set -e
            for crate in packaging/shedos-screensaver packaging/shedos-prompt-ui \
                         packaging/shedos-greeter packaging/shedos-power \
                         packaging/shedos-tour packaging/shedos-switcher; do
                echo "---- cargo test $crate ----"
                (cd "$crate" && cargo test --locked)
            done'

      - name: Run shell test suites
        run: sudo -u tester bash scripts/run-shell-tests.sh
