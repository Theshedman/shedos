name: cut-release

# Reconcile the shedos-meta closure + manifest, commit to main, then tag that
# commit. The tag is born in the same container that validates it, so a local
# cut's stale-manifest drift can't happen.

on:
  workflow_dispatch:
    inputs:
      kind:
        description: 'rc (vDATE-rcN) or stable (vDATE)'
        type: choice
        options: [rc, stable]
        default: rc

concurrency:
  group: cut-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cut:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm base-devel git sudo gnupg pacman-contrib python
          pacman-key --init
          pacman-key --populate archlinux

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Trust workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Compute the tag
        env:
          KIND: ${{ inputs.kind }}
        run: |
          set -euo pipefail
          today=$(date -u +%Y.%m.%d)
          if [ "$KIND" = stable ]; then
              tag="v$today"
          else
              max_n=$(git ls-remote --tags origin "refs/tags/v$today-rc*" 2>/dev/null \
                  | sed -nE 's|.*refs/tags/v[0-9]{4}\.[0-9]{2}\.[0-9]{2}-rc([0-9]+)$|\1|p' \
                  | sort -n | tail -1)
              next=${max_n:+$((max_n + 1))}
              tag="v$today-rc${next:-1}"
          fi
          if git ls-remote --tags origin "refs/tags/$tag" 2>/dev/null | grep -q "refs/tags/$tag$"; then
              echo "::error::tag $tag already exists on origin" >&2
              exit 1
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "$today" > VERSION
          echo "cutting $tag (VERSION=$today)"

      - name: Reconcile manifest to the live closure
        run: bash scripts/reconcile-release.sh

      - name: Commit, tag, and push atomically
        run: |
          set -euo pipefail
          git config user.name  "shedos-ci[bot]"
          git config user.email "shedos-ci[bot]@users.noreply.github.com"
          if ! git diff --quiet -- packaging/ packages/ VERSION; then
              git add packaging/ packages/ VERSION
              git commit -m "chore(release): reconcile $TAG"
          else
              echo "manifest already in sync; tagging HEAD as-is"
          fi
          git tag -a "$TAG" -m "release: $TAG"
          git push --atomic origin HEAD:main "refs/tags/$TAG"
          echo "pushed $TAG"
