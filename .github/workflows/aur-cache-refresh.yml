name: aur-cache-refresh

on:
  schedule:
    - cron: '0 6 * * 1'   # 1h ahead of release-weekly
  workflow_dispatch:

concurrency:
  group: aur-cache-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    # actions:write lets the gh API delete the existing cache before re-save
    permissions:
      actions: write
      contents: read

    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm
          # makepkg --nodeps won't resolve makedeps, so install them up front
          pacman -S --needed --noconfirm base-devel git sudo scdoc github-cli
          pacman-key --init
          pacman-key --populate archlinux
          # build-aur-packages.sh's builduser needs passwordless sudo
          echo '%wheel ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/wheel
          chmod 440 /etc/sudoers.d/wheel

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Restore current AUR cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: archiso/shedos-repo
          key: aur-${{ runner.os }}-${{ hashFiles('packages/aur.txt') }}
          restore-keys: |
            aur-${{ runner.os }}-

      - name: Refresh every AUR package from upstream
        env:
          SHEDOS_AUR_FORCE_REBUILD: '1'
          SHEDOS_AUR_STRICT_PGP: '1'
          # don't let one broken upstream package strand the whole sweep
          SHEDOS_AUR_BEST_EFFORT: '1'
        run: bash scripts/build-aur-packages.sh

      - name: Drop stale cache entry under primary key
        # cache/save fails on a duplicate key, so clear it first
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CACHE_KEY: aur-${{ runner.os }}-${{ hashFiles('packages/aur.txt') }}
        run: |
          gh cache delete "$CACHE_KEY" --repo "$GITHUB_REPOSITORY" \
              2>/dev/null || \
              echo "no existing cache entry under $CACHE_KEY (fine)"

      - name: Save refreshed cache
        # save even on a no-op refresh to outrun the 7-day cache TTL
        if: always()
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: archiso/shedos-repo
          key: aur-${{ runner.os }}-${{ hashFiles('packages/aur.txt') }}
