name: deploy-site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'VERSION'
      - '.github/workflows/deploy-site.yml'
  # Manual re-deploy from the Actions tab. Useful when a new ISO lands on
  # repo.shedos.org and we want /download to reflect it immediately.
  workflow_dispatch:

# GitHub Pages publish requires these three.
permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deploy at a time; don't cancel an in-flight deploy, let it finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
        with:
          # site/scripts/sync-version.mjs runs `git tag --sort=-v:refname`
          # to resolve the newest published stable + RC. The default
          # shallow clone has no tags, so pull full history.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        # `prebuild` runs sync-version.mjs, which probes repo.shedos.org
        # for the newest published ISO and writes src/generated/version.ts.
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
