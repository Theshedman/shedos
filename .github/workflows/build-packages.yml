name: build-packages

# Builds every PKGBUILD under packaging/, signs with the repo GPG key, and
# publishes the repo DB + packages to r2:shedos-repo/{stable,test}/x86_64/.
# Runs on pushes to main that touch package contents. Manual dispatch is
# also allowed.

on:
  push:
    branches: [main]
    paths:
      - 'packaging/**'
      - 'packages/**'
      - 'scripts/render-meta-depends.sh'
      - 'scripts/build-aur-packages.sh'
      - 'scripts/build-shedos-packages.sh'
      - '.github/workflows/build-packages.yml'
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: repo-publish
  cancel-in-progress: false

# contents: write so the auto-bump step (main pushes only) can commit
# the refreshed PKGBUILD pkgrel + manifest back to main.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Secrets (SHEDOS_REPO_SIGNING_KEY, R2_*) are scoped to this environment.
    # Without this line the `secrets.*` lookups below resolve to empty strings.
    environment: SHEDOS_ENV
    container:
      image: archlinux:latest
      options: --privileged
      # Mount the host root so we can free disk space before makepkg
      # pulls down kernel sources + builds. ubuntu-latest ships ~30 GB
      # of preinstalled toolchains (dotnet, android-sdk, ghc, …) we
      # don't need; trim them up front to keep the workspace from
      # filling on a cold cache.
      volumes:
        - /:/host

    env:
      R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      R2_BUCKET: shedos-repo

    steps:
      - name: Free host disk space
        # Strip preinstalled toolchains we don't use so makepkg has room
        # to extract kernel sources + build a fresh shedos-kernel on a
        # cold cache. Cheap when the cache hits (no-op).
        run: |
          df -h /__w || true
          rm -rf \
              /host/usr/share/dotnet \
              /host/usr/local/lib/android \
              /host/opt/ghc \
              /host/opt/hostedtoolcache \
              /host/usr/local/share/boost \
              /host/usr/local/share/powershell \
              /host/usr/share/swift \
              /host/opt/microsoft \
              /host/usr/lib/jvm \
              2>/dev/null || true
          df -h /__w || true

      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm
          # scdoc is a makedep of shedos-system (renders man/*.scd → *.1).
          # ccache is wired into makepkg via the build user's ~/.makepkg.conf
          # below; it cuts shedos-kernel rebuilds from ~40 min to ~5 min on
          # warm cache.
          # makepkg runs with --nodeps for the pure-copy shedos-* packages,
          # so makedeps can't be left to --syncdeps — install them directly.
          pacman -S --needed --noconfirm base-devel git sudo gnupg rclone pacman-contrib scdoc ccache python
          # archlinux:latest ships an empty pacman keyring. Initialize + populate
          # the archlinux trust chain so makepkg --syncdeps can verify signed
          # packages from core/extra during dependency resolution.
          pacman-key --init
          pacman-key --populate archlinux
          # makepkg refuses to run as root; create a build user.
          useradd -m -G wheel builder
          echo '%wheel ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/wheel
          chmod 440 /etc/sudoers.d/wheel

      - uses: actions/checkout@v4
        with:
          # Need the full token so the auto-bump step can push back to
          # main; the default GITHUB_TOKEN works because permissions
          # block above grants contents:write.
          token: ${{ secrets.GITHUB_TOKEN }}
          # fetch-depth: 0 so we have full history for the push.
          fetch-depth: 0

      - name: Auto-bump release-hashes (main + manual)
        # On main pushes (and workflow_dispatch from main), run
        # `make bump` and commit the result back. The [skip ci]
        # marker prevents the push from re-triggering this workflow.
        if: github.ref == 'refs/heads/main'
        env:
          GIT_AUTHOR_NAME: shedos-ci[bot]
          GIT_AUTHOR_EMAIL: shedos-ci[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: shedos-ci[bot]
          GIT_COMMITTER_EMAIL: shedos-ci[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          # Container-based jobs don't reliably set CWD to GITHUB_WORKSPACE
          # for run blocks, and modern git refuses to operate on dirs whose
          # ownership it considers "dubious" (root in container, runner uid
          # on host) without safe.directory.
          cd "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global user.name  "$GIT_AUTHOR_NAME"
          git config --global user.email "$GIT_AUTHOR_EMAIL"
          bash scripts/bump-version.sh
          if git diff --quiet -- packaging/ VERSION; then
              echo "Manifest in sync; no bump needed."
              exit 0
          fi
          git add packaging/ VERSION
          git commit -m "chore(release): auto-bump pkgrel for changed packages [skip ci]"
          # Tolerate a concurrent push to main (rare but possible). Rebase
          # our auto-bump on top of any new HEAD before pushing.
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Validate release-hashes manifest (tag pushes)
        # Tag pushes must point at a commit whose manifest already
        # matches its PKGBUILDs — CI doesn't rewrite tagged commits.
        # If --check fails here, push to main first to trigger the
        # auto-bump, then re-tag the resulting auto-bump commit.
        if: startsWith(github.ref, 'refs/tags/')
        run: bash scripts/bump-version.sh --check

      - name: Restore ccache
        # ccache survives across runs, keyed on the kernel PKGBUILD +
        # config so an upstream-zen bump or a config edit invalidates the
        # cache (real source change), but a CI re-run on the same sources
        # warm-hits and trims ~2 h off the build. Restore-keys falls back
        # to any prior cache for partial reuse. Same key shape as
        # build-iso.yml — both workflows populate / consume one cache.
        uses: actions/cache@v4
        with:
          path: /home/builder/.ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('packaging/shedos-kernel/PKGBUILD', 'packaging/shedos-kernel/config.x86_64') }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Wire ccache into makepkg
        run: |
          install -d -o builder -g builder /home/builder/.ccache
          # Prepend ccache to PATH inside builder's makepkg invocations.
          # ccache transparently fronts /usr/bin/{gcc,cc,g++}; binutils
          # untouched.
          install -d -o builder -g builder /home/builder
          cat > /home/builder/.makepkg.conf <<'EOF'
          BUILDENV=(!distcc color !check !sign ccache)
          MAKEFLAGS="-j$(nproc)"
          EOF
          chown builder:builder /home/builder/.makepkg.conf

      - name: Resolve shedos-meta Arch closure
        # Regenerates packages/.meta-closure.txt against the runner's
        # fresh pacman db so shedos-meta's depends has every transitive
        # Arch dep explicit, even if upstream added/dropped packages
        # since the closure file was last committed. Runs as root —
        # pacman -Sy needs it.
        run: bash scripts/resolve-meta-closure.sh

      - name: Refresh shedos-meta depends
        run: |
          chown -R builder:builder .
          sudo -u builder bash scripts/render-meta-depends.sh

      - name: Import signing key
        env:
          SIGNING_KEY: ${{ secrets.SHEDOS_REPO_SIGNING_KEY }}
        run: |
          mkdir -p /home/builder/.gnupg
          chmod 700 /home/builder/.gnupg
          chown -R builder:builder /home/builder/.gnupg

          # Defensive pre-check: surface the common failure modes (empty
          # secret, wrong file pasted, flattened newlines) before gpg's
          # generic "no valid OpenPGP data" error.
          if [[ -z "$SIGNING_KEY" ]]; then
              echo "FATAL: SHEDOS_REPO_SIGNING_KEY secret is empty or unset." >&2
              exit 1
          fi
          echo "signing key secret length: ${#SIGNING_KEY} bytes"
          first_line=$(printf '%s' "$SIGNING_KEY" | head -n1)
          echo "first line: $first_line"
          if [[ "$first_line" != "-----BEGIN PGP PRIVATE KEY BLOCK-----" ]]; then
              echo "FATAL: secret does not start with the armored PGP private key header." >&2
              echo "       Expected: -----BEGIN PGP PRIVATE KEY BLOCK-----" >&2
              echo "       Got:      $first_line" >&2
              echo "       Re-run key-ceremony.sh and paste shedos-private.asc verbatim." >&2
              exit 1
          fi

          printf '%s\n' "$SIGNING_KEY" | sudo -u builder gpg --batch --import

          FP=$(sudo -u builder gpg --list-secret-keys --with-colons \
               | awk -F: '/^fpr:/ { print $10; exit }')
          echo "GPG_FP=$FP" >> "$GITHUB_ENV"

          EXPECTED=$(awk 'NF && $1 !~ /^#/ { print; exit }' \
            packaging/shedos-keyring/tree/shedos-trusted)
          if [[ "$FP" != "$EXPECTED" ]]; then
              echo "FATAL: signing key fingerprint ($FP) does not match"
              echo "       committed shedos-trusted ($EXPECTED). Refusing to publish."
              exit 1
          fi

      - name: Restore AUR package cache
        # AUR builds take ~35 min from cold. build-aur-packages.sh has a
        # cache-trust pre-flight: if a package's .pkg.tar.zst is present in
        # archiso/shedos-repo/ here, it skips the AUR clone AND the build
        # entirely (cache key gates this on aur.txt content, so any restored
        # binary was built for the current package list).
        # That makes a cache-hit run a near-instant no-op even when AUR is
        # totally down. Restore-keys handles partial matches (one new package
        # doesn't invalidate the other 38). The weekly release-weekly.yml
        # job re-pulls every package fresh under SHEDOS_AUR_FORCE_REBUILD=1
        # so the cache doesn't drift far behind upstream.
        #
        # We use restore/save as separate actions (not the combined `cache`
        # action) because the combined action's post-save is gated on
        # `success()` — so a downstream failure would discard a successful
        # prebuild's output. Save is triggered explicitly below with
        # `if: always()`.
        id: aur-cache
        uses: actions/cache/restore@v4
        with:
          path: archiso/shedos-repo
          key: aur-${{ runner.os }}-${{ hashFiles('packages/aur.txt') }}
          restore-keys: |
            aur-${{ runner.os }}-

      - name: Pre-build AUR packages
        # Populates archiso/shedos-repo/ with every AUR package listed in
        # packages/aur.txt (~38 pkgs). Output serves two purposes:
        #   1. Satisfies makepkg --syncdeps for the shedos-* build loop below
        #      (via [shedos-repo] registered in the next step).
        #   2. The OSS subset is re-signed and republished to [shedos] in the
        #      "Sign + stage OSS AUR packages" step, so installed systems can
        #      resolve shedos-meta's depends=() from repo.shedos.org alone.
        # The script handles root→builduser hop internally. With the cache
        # restored above, unchanged packages skip rebuilds.
        run: scripts/build-aur-packages.sh

      - name: Save AUR package cache
        # Unconditionally save (if we didn't already hit the exact key) so a
        # downstream failure in the shedos-* build / sign / publish steps
        # doesn't cost us the 35 min we just spent prebuilding AUR.
        if: always() && steps.aur-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: archiso/shedos-repo
          key: aur-${{ runner.os }}-${{ hashFiles('packages/aur.txt') }}

      - name: Restore shedos-kernel package cache
        # Whole-package cache keyed on the kernel PKGBUILD + config. When
        # upstream linux-zen pkgver hasn't bumped (scripts/bump-kernel.sh
        # rewrites the PKGBUILD on bumps) and the config is unchanged,
        # the last successful run's shedos-kernel-*.pkg.tar.zst is
        # restored here. The pre-flight in scripts/build-shedos-packages.sh
        # sees the file already in archiso/shedos-repo/ and skips makepkg
        # entirely (~30 s cache copy vs ~40 min ccache rebuild).
        id: kernel-pkg-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/shedos-kernel-pkg-cache
          key: shedos-kernel-pkg-${{ runner.os }}-${{ hashFiles('packaging/shedos-kernel/PKGBUILD', 'packaging/shedos-kernel/config.x86_64') }}

      - name: Stage cached shedos-kernel package (or clear stale)
        # AUR-cache restore above may carry a stale kernel from a prior
        # run on different kernel sources (its key is aur.txt-only,
        # orthogonal to the kernel state). The dedicated kernel-pkg-cache
        # is the authoritative gate:
        #   * hit  → wipe AUR-restored kernel, lay down the cached one
        #   * miss → wipe AUR-restored kernel so the script's pre-flight
        #            file-exists check fails and triggers a real rebuild
        # Either way archiso/shedos-repo's kernel state matches the
        # current PKGBUILD.
        run: |
          mkdir -p archiso/shedos-repo
          rm -f archiso/shedos-repo/shedos-kernel-*.pkg.tar.zst
          if [[ "${{ steps.kernel-pkg-cache.outputs.cache-hit }}" == "true" ]]; then
              cp -v /tmp/shedos-kernel-pkg-cache/*.pkg.tar.zst archiso/shedos-repo/
              chown -R builder:builder archiso/shedos-repo
              echo "Cached kernel staged; build-shedos-packages.sh pre-flight will skip rebuild."
          else
              echo "Kernel cache missed; build-shedos-packages.sh will rebuild from source."
          fi

      - name: Restore shedos-pkgs cache
        # Per-build incremental cache for non-kernel shedos-* packages.
        # github.sha makes the key always-miss on a fresh push;
        # restore-keys falls back to the most recent saved cache.
        # build-shedos-packages.sh's pre-flight skips any package whose
        # pkgver-pkgrel matches an existing .pkg.tar.zst in
        # archiso/shedos-repo, so unchanged packages don't rebuild.
        id: shedos-pkgs-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/shedos-pkg-cache
          key: shedos-pkgs-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            shedos-pkgs-${{ runner.os }}-

      - name: Stage cached shedos packages into shedos-repo
        run: |
          if [[ -d /tmp/shedos-pkg-cache ]]; then
              mkdir -p archiso/shedos-repo
              cp -v /tmp/shedos-pkg-cache/*.pkg.tar.zst archiso/shedos-repo/ 2>/dev/null || true
              cp -v /tmp/shedos-pkg-cache/*.pkg.tar.zst.sig archiso/shedos-repo/ 2>/dev/null || true
              chown -R builder:builder archiso/shedos-repo 2>/dev/null || true
              echo "Staged cached shedos packages from /tmp/shedos-pkg-cache."
          else
              echo "shedos-pkgs cache empty; build-shedos-packages.sh will build from source."
          fi

      - name: Build shedos-* packages
        # Delegates to the same script the ISO build uses so the logic stays
        # in one place. It:
        #   - orders builds topologically (shedos-keyring → shedos-system →
        #     shedos-branding → shedos-hyprland → shedos-nvim → shedos-meta),
        #   - registers archiso/shedos-repo as [shedos-repo] in /etc/pacman.conf
        #     and rebuilds the repo DB after every package so later builds can
        #     resolve earlier ones via pacman,
        #   - handles the root→builduser hop internally.
        # After this runs, archiso/shedos-repo/ holds every package we want
        # published (shedos-* + OSS AUR + unsigned proprietary AUR).
        run: scripts/build-shedos-packages.sh

      - name: Stage shedos-kernel package for cache save
        # If we just rebuilt the kernel (cache miss), mirror the resulting
        # pkg.tar.zst into the dedicated cache path so the save step below
        # pushes it to GHA cache. No-op on hit (same files staged in
        # archiso/shedos-repo would be copied to themselves).
        if: always() && steps.kernel-pkg-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/shedos-kernel-pkg-cache
          cp -v archiso/shedos-repo/shedos-kernel-*.pkg.tar.zst \
              /tmp/shedos-kernel-pkg-cache/ 2>/dev/null || true
          ls -la /tmp/shedos-kernel-pkg-cache/

      - name: Save shedos-kernel package cache
        # Persist the freshly-built kernel for the next run. Only saves on
        # cache miss — a hit means the cache already has these files.
        # `if: always()` so a downstream failure (signing, publish) doesn't
        # discard the kernel build we just spent ~40 min on (or longer
        # cold).
        if: always() && steps.kernel-pkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/shedos-kernel-pkg-cache
          key: shedos-kernel-pkg-${{ runner.os }}-${{ hashFiles('packaging/shedos-kernel/PKGBUILD', 'packaging/shedos-kernel/config.x86_64') }}

      - name: Sign + stage packages for publication
        # Walk archiso/shedos-repo/, sign each .pkg.tar.zst with the ShedOS
        # key, and move to dist/x86_64/ — UNLESS the package is listed in
        # packages/aur-norepublish.txt (proprietary EULAs forbid third-party
        # redistribution under our signature; users get those via yay /
        # shedos-welcome).
        run: |
          install -d -o builder -g builder dist/x86_64
          # build-shedos-packages.sh emits packages as root-owned (via cp);
          # chown so gpg running as builder can read.
          chown -R builder:builder archiso/shedos-repo

          mapfile -t norepublish < <(
              grep -hEv '^\s*(#|$)' packages/aur-norepublish.txt
          )

          staged=0 reused=0 skipped=0
          for pkg in archiso/shedos-repo/*.pkg.tar.zst; do
              [[ -f $pkg ]] || continue
              base=$(basename "$pkg")
              pkgname=${base%-*-*-*.pkg.tar.zst}
              skip=0
              for n in "${norepublish[@]}"; do
                  if [[ $pkgname == "$n" ]]; then skip=1; break; fi
              done
              if [[ $skip -eq 1 ]]; then
                  echo "skip  $pkgname (norepublish)"
                  skipped=$((skipped+1))
                  continue
              fi
              # Reuse cache-restored signature if present. GPG signatures
              # don't expire, so a cached sig is just as valid as a fresh
              # one — and rclone sync skips the re-upload because bytes
              # don't change. Saves ~50 GPG calls + ~50 R2 PUTs per no-op
              # build. On key rotation, manually purge the GHA cache.
              if [[ -f "${pkg}.sig" ]]; then
                  echo "reuse $pkgname (cached signature)"
                  cp "$pkg" "${pkg}.sig" dist/x86_64/
                  reused=$((reused+1))
                  continue
              fi
              echo "sign  $pkgname"
              sudo -u builder gpg --batch --detach-sign --no-armor \
                  --local-user "$GPG_FP" \
                  --output "$pkg.sig" "$pkg"
              # cp (not mv) — keep the package in archiso/shedos-repo/ so it
              # remains in the cache snapshot for the next run.
              cp "$pkg" "$pkg.sig" dist/x86_64/
              staged=$((staged+1))
          done
          echo "staged $staged freshly signed; $reused cache-restored sigs; $skipped proprietary"
          ls -la dist/x86_64/ | head -30

      - name: Stage cached repo DB into dist/x86_64/
        # Restore the prior build's signed repo DB if the cache hit. The
        # next step short-circuits when /tmp/built-pkgs.txt is empty
        # (nothing rebuilt) and a cached DB is present.
        #
        # Pacman fetches `<repo>.db` (and `<repo>.files`), NOT the
        # `.tar.gz` form, so we materialize those names alongside the
        # archive copies. R2 stores files content-addressed so a `cp`
        # from .tar.gz is what actually ends up at the published URL.
        run: |
          install -d -o builder -g builder dist/x86_64
          for f in shedos.db.tar.gz shedos.db.tar.gz.sig \
                   shedos.files.tar.gz shedos.files.tar.gz.sig; do
              if [[ -f /tmp/shedos-pkg-cache/$f ]]; then
                  cp -v /tmp/shedos-pkg-cache/$f dist/x86_64/
              fi
          done
          if [[ -f dist/x86_64/shedos.db.tar.gz ]]; then
              cp -v dist/x86_64/shedos.db.tar.gz    dist/x86_64/shedos.db
          fi
          if [[ -f dist/x86_64/shedos.db.tar.gz.sig ]]; then
              cp -v dist/x86_64/shedos.db.tar.gz.sig    dist/x86_64/shedos.db.sig
          fi
          if [[ -f dist/x86_64/shedos.files.tar.gz ]]; then
              cp -v dist/x86_64/shedos.files.tar.gz dist/x86_64/shedos.files
          fi
          if [[ -f dist/x86_64/shedos.files.tar.gz.sig ]]; then
              cp -v dist/x86_64/shedos.files.tar.gz.sig dist/x86_64/shedos.files.sig
          fi

      - name: Build repo DB
        run: |
          # Skip repo-add only when nothing was rebuilt AND the cached
          # DB's package count matches what's on disk. The disk-vs-DB
          # equality is what catches deletions: built-pkgs.txt is
          # empty but the cached DB still names files no longer in dist/.
          disk_count=$(ls -1 dist/x86_64/*.pkg.tar.zst 2>/dev/null | wc -l)
          db_count=0
          if [[ -f dist/x86_64/shedos.db.tar.gz ]]; then
              db_count=$(bsdtar -tf dist/x86_64/shedos.db.tar.gz 2>/dev/null \
                         | awk -F/ '$2 == "desc" {print $1}' | sort -u | wc -l)
          fi
          if [[ ! -s /tmp/built-pkgs.txt ]] \
             && [[ -f dist/x86_64/shedos.db.tar.gz ]] \
             && [[ "$disk_count" -eq "$db_count" ]]; then
              echo "No packages rebuilt and DB ($db_count) matches disk ($disk_count) — reusing cached repo DB"
              ls -la dist/x86_64/shedos.db.tar.gz dist/x86_64/shedos.files.tar.gz
              exit 0
          fi
          echo "Rebuilding repo DB: built=$([[ -s /tmp/built-pkgs.txt ]] && wc -l </tmp/built-pkgs.txt || echo 0), disk=$disk_count, db=$db_count"
          cd dist/x86_64
          # Wipe the cached db artifacts so repo-add rebuilds fresh.
          # Without this, repo-add only adds entries — it never removes
          # entries whose .pkg.tar.zst was cleaned up between builds,
          # leading pacman to 404 on stale package names listed in db.
          rm -f shedos.db shedos.db.sig shedos.db.tar.gz shedos.db.tar.gz.sig \
                shedos.files shedos.files.sig shedos.files.tar.gz shedos.files.tar.gz.sig
          sudo -u builder repo-add --sign --key "$GPG_FP" \
              shedos.db.tar.gz *.pkg.tar.zst
          # repo-add leaves shedos.db / shedos.files as symlinks to their
          # .tar.gz counterparts. R2 has no symlink concept and pacman on
          # the installed system fetches `shedos.db` as a regular object,
          # so materialize the symlinks into real files. rm first because
          # `cp <src> <symlink-to-src>` sees source == destination and
          # aborts with "are the same file".
          for name in shedos.db shedos.db.sig shedos.files shedos.files.sig; do
              [[ -L $name ]] && rm -f "$name"
          done
          cp shedos.db.tar.gz shedos.db
          cp shedos.db.tar.gz.sig shedos.db.sig
          cp shedos.files.tar.gz shedos.files
          cp shedos.files.tar.gz.sig shedos.files.sig

      - name: Stage shedos packages for cache save
        # Mirror non-kernel shedos-*.pkg.tar.zst + their .sig files +
        # the repo DB into the cache path so a no-op run can skip
        # makepkg, gpg --sign, and repo-add entirely. Kernel files
        # live in their own dedicated cache. Two prunes happen first:
        # phantoms (no packaging/<pkgname>/) and stale pkgver/pkgrels.
        if: always()
        run: |
          mkdir -p /tmp/shedos-pkg-cache
          shopt -s nullglob
          declare -A keep_shedos=()
          for dir in packaging/shedos-*/; do
              [[ -f "$dir/PKGBUILD" ]] || continue
              keep_shedos[$(basename "$dir")]=1
          done
          [[ -n ${keep_shedos[shedos-kernel]:-} ]] && keep_shedos[shedos-kernel-headers]=1
          for f in /tmp/shedos-pkg-cache/shedos-*.pkg.tar.zst; do
              base=$(basename "$f")
              pkgname=${base%-*-*-*.pkg.tar.zst}
              if [[ -z ${keep_shedos[$pkgname]:-} ]]; then
                  echo "  cache prune phantom: $base"
                  rm -f "$f" "${f}.sig"
              fi
          done
          for dir in packaging/shedos-*/; do
              pkgname=$(basename "$dir")
              [[ -f "$dir/PKGBUILD" ]] || continue
              [[ "$pkgname" == "shedos-kernel" ]] && continue
              pkgver=$(awk -F= '/^pkgver=/ {print $2; exit}' "$dir/PKGBUILD")
              pkgrel=$(awk -F= '/^pkgrel=/ {print $2; exit}' "$dir/PKGBUILD")
              for stale in /tmp/shedos-pkg-cache/${pkgname}-*.pkg.tar.zst; do
                  base=$(basename "$stale")
                  [[ "$base" == "${pkgname}-${pkgver}-${pkgrel}-"*.pkg.tar.zst ]] && continue
                  echo "  cache prune stale-version: $base"
                  rm -f "$stale" "${stale}.sig"
              done
          done
          for f in archiso/shedos-repo/shedos-*.pkg.tar.zst; do
              case "$(basename "$f")" in
                  shedos-kernel-*) continue ;;
              esac
              cp -v "$f" /tmp/shedos-pkg-cache/
              [[ -f "${f}.sig" ]] && cp -v "${f}.sig" /tmp/shedos-pkg-cache/
          done
          for f in dist/x86_64/shedos.db.tar.gz dist/x86_64/shedos.db.tar.gz.sig \
                   dist/x86_64/shedos.files.tar.gz dist/x86_64/shedos.files.tar.gz.sig; do
              [[ -f $f ]] && cp -v "$f" /tmp/shedos-pkg-cache/
          done
          ls -la /tmp/shedos-pkg-cache/ | head -20

      - name: Save shedos-pkgs cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /tmp/shedos-pkg-cache
          key: shedos-pkgs-${{ runner.os }}-${{ github.sha }}

      - name: Publish to R2
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ env.R2_ENDPOINT }}
          RCLONE_CONFIG_R2_REGION: auto
          # R2 API tokens scoped to a specific bucket don't have CreateBucket
          # permission. rclone probes HeadBucket → CreateBucket on every new
          # path; with this flag it assumes the bucket exists (which it does)
          # and skips the probe. Without it copyto to the bucket root 403s.
          RCLONE_S3_NO_CHECK_BUCKET: "true"
        run: |
          # Channel routing:
          #   * push to main           → /test/x86_64/ (from this run's dist/)
          #   * RC tag (v<date>-rcN)   → /test/x86_64/ (same as push)
          #   * stable tag (v<date>)   → /stable/x86_64/ via rclone copy from
          #                              /test/x86_64/, NO rebuild. dist/ is
          #                              ignored. Uses rclone copy (not sync)
          #                              so /stable/ retains older versions
          #                              for downgrade.
          if [[ "$GITHUB_REF_TYPE" == "tag" ]] && [[ "$GITHUB_REF_NAME" != *-rc* ]]; then
              echo "Stable tag $GITHUB_REF_NAME: promoting /test/x86_64/ → /stable/x86_64/"
              rclone copy "r2:$R2_BUCKET/test/x86_64/" "r2:$R2_BUCKET/stable/x86_64/" --progress
          else
              echo "Push or RC tag: publishing dist/x86_64/ → /test/x86_64/"
              rclone sync dist/x86_64/ "r2:$R2_BUCKET/test/x86_64/" --progress
          fi
          # Ship the bootstrap pubkey at the bucket root so the migration
          # script can fetch it without the keyring installed.
          rclone copyto packaging/shedos-keyring/tree/shedos.gpg \
              "r2:$R2_BUCKET/shedos.gpg"

      - name: Retention sweep for test channel
        # Keep the latest 3 RC iterations + 2 stables-of-each-package in
        # /test/x86_64/. Anything older is purged. Stable repo
        # (/stable/x86_64/) has no sweep — repo-add already manages its
        # generation, and stable users want the long tail of older
        # versions for downgrade.
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ env.R2_ENDPOINT }}
          RCLONE_CONFIG_R2_REGION: auto
          RCLONE_S3_NO_CHECK_BUCKET: "true"
        run: |
          KEEP_PER_PKG=5  # latest N versions per package name
          set -u
          # Group by pkgname; sort by mtime; delete everything past the
          # keep threshold per group. rclone lsf gives "name;mtime" lines
          # we can sort over.
          mapfile -t entries < <(
              rclone lsf --format "ts" --files-only --absolute \
                  "r2:$R2_BUCKET/test/x86_64/" 2>/dev/null \
                  | grep -E '\.pkg\.tar\.zst$' \
                  | sort
          )
          # No-op early if the test prefix is empty (first publish).
          if (( ${#entries[@]} == 0 )); then
              echo "test prefix empty or unreadable; skipping sweep."
              exit 0
          fi
          declare -A by_pkg=()
          for line in "${entries[@]}"; do
              ts=${line%%;*}
              path=${line#*;}
              base=$(basename "$path")
              # pkgname is everything up to the last "-<ver>-<rel>-<arch>".
              # `<arch>` is always the last token (after final `-`).
              pkgname=${base%-*-*-*.pkg.tar.zst}
              by_pkg["$pkgname"]+="$ts;$path"$'\n'
          done
          purged=0
          for pkgname in "${!by_pkg[@]}"; do
              # Sort newest first; keep first $KEEP_PER_PKG; purge rest.
              mapfile -t versions < <(
                  printf '%s' "${by_pkg[$pkgname]}" \
                      | grep -v '^$' | sort -r
              )
              if (( ${#versions[@]} <= KEEP_PER_PKG )); then continue; fi
              for v in "${versions[@]:KEEP_PER_PKG}"; do
                  path=${v#*;}
                  base=$(basename "$path")
                  echo "purge test/$base (over keep=$KEEP_PER_PKG)"
                  rclone delete "r2:$R2_BUCKET/test/x86_64/$base" \
                      || true
                  rclone delete "r2:$R2_BUCKET/test/x86_64/$base.sig" \
                      || true
                  purged=$((purged+1))
              done
          done
          echo "purged $purged old test-channel package files."
