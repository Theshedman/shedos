name: kernel-version-watcher

# Polls Arch's linux-zen pkgver weekly and opens a PR bumping
# packaging/shedos-kernel/{PKGBUILD,config.x86_64} when upstream has
# moved. The actual kernel build happens via build-packages.yml when
# the PR merges to main; this workflow only generates the diff.
#
# Modeled on release-weekly.yml's PR-open shape: an unsigned bot
# commit on a release branch, then `gh pr create`. The maintainer
# reviews, signs, fast-forwards main locally per docs/releasing.md.

on:
  schedule:
    - cron: '0 6 * * 3'   # Wednesdays, 06:00 UTC (offset from release-weekly Mondays)
  workflow_dispatch:

jobs:
  poll-and-open-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine target pkgver
        id: pkgver
        run: |
          set -euo pipefail
          target=$(curl -fsS https://archlinux.org/packages/extra/x86_64/linux-zen/json/ \
              | python3 -c "import json,sys; print(json.load(sys.stdin)['pkgver'])")
          current=$(awk -F= '/^pkgver=/ {print $2; exit}' packaging/shedos-kernel/PKGBUILD)
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          if [[ $target == "$current" ]]; then
              echo "shedos-kernel already at $target — no PR needed"
              echo "needs_bump=false" >> "$GITHUB_OUTPUT"
          else
              echo "shedos-kernel needs bump: $current → $target"
              echo "needs_bump=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump and open PR
        if: steps.pkgver.outputs.needs_bump == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ steps.pkgver.outputs.target }}
          CURRENT: ${{ steps.pkgver.outputs.current }}
        run: |
          set -euo pipefail
          branch="kernel/bump-$TARGET"

          existing=$(gh pr list --head "$branch" --json number --jq '.[0].number' || true)
          if [[ -n "$existing" ]]; then
              echo "PR #$existing already open for $branch — no-op"
              exit 0
          fi

          bash scripts/bump-kernel.sh "$TARGET"

          git config user.name 'shedos-release-bot'
          git config user.email 'shedos-release-bot@users.noreply.github.com'

          git checkout -b "$branch"
          git add packaging/shedos-kernel/
          if git diff --cached --quiet; then
              echo "bump-kernel.sh produced no diff — nothing to release"
              exit 0
          fi
          # Unsigned bot commit; the maintainer rebases + signs locally
          # per docs/releasing.md before fast-forwarding main.
          git commit -m "kernel: bump to $TARGET"
          git push -u origin "$branch"

          gh pr create \
              --base main \
              --head "$branch" \
              --title "kernel: bump shedos-kernel to $TARGET" \
              --body "$(cat <<EOF
          Automated weekly bump of \`shedos-kernel\` to upstream
          \`linux-zen $TARGET\` (was $CURRENT).

          Generated by \`scripts/bump-kernel.sh\` from
          gitlab.archlinux.org/archlinux/packaging/packages/linux-zen
          at tag \`${TARGET}-1\`.

          ## Verify locally before merging

          \`\`\`sh
          git fetch origin $branch
          git checkout main && git pull --ff-only
          git merge --squash "origin/$branch"
          git commit -S -s -m "kernel: bump to $TARGET"
          make test-kernel               # storage-driver contract
          # Optional: full build to confirm the kernel still compiles
          # cd packaging/shedos-kernel && makepkg --syncdeps --noconfirm
          git push origin main
          git push origin --delete "$branch"
          gh pr close ${GH_PR_NUMBER:-<this PR>}
          \`\`\`

          The CI build-packages workflow rebuilds shedos-kernel +
          shedos-kernel-headers from the new sources when this lands
          on main. Build is ~30-50 min cold; ccache cuts re-bumps to
          ~5 min.
          EOF
          )"
